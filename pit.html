<style>
  body { padding: 20px 16px 32px; }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* connection bar */
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted); flex: none;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* Photos. A strip rather than a panel: it sits above the racer cards and
     everything on this screen competes with the button somebody came to press. */
  .photo-bar {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; margin-bottom: 16px;
  }
  /* The head is the whole control: shut by default, and the one thing it has
     to say while shut is how many photos are waiting for signal. */
  .photo-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; background: transparent; border: 0; padding: 0; cursor: pointer;
    text-align: left; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .photo-head:hover { color: var(--accent); }
  .photo-head-right { display: flex; align-items: center; gap: 8px; }
  .photo-head-warn { color: var(--yellow); }
  .photo-head-err { color: var(--red); }
  .photo-head-caret::before { content: '▼'; font-size: 8px; }
  .photo-bar.collapsed .photo-head-caret::before { content: '▶'; }
  .photo-body { margin-top: 2px; }
  /* `hidden` works through a UA display rule and any author display outranks
     it. Nothing here sets one, but the next person to add a flex row to this
     body would find the section open at every load and not know why. */
  .photo-body[hidden] { display: none; }
  .photo-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .photo-row select, .photo-row input[type="text"] {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 9px 10px; font-size: 13px; font-family: inherit;
  }
  .photo-row select { flex: 1 1 190px; min-width: 0; }
  .photo-row input[type="text"] { flex: 2 1 220px; min-width: 0; }
  /* The file input itself is hidden behind a label: every browser styles it
     differently and none of them the way the rest of this page is styled. */
  .photo-pick {
    flex: 1 1 130px; text-align: center; cursor: pointer;
    background: transparent; border: 1px dashed var(--border-bright); color: var(--text-dim);
    padding: 10px 14px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .photo-pick:hover { color: var(--accent); border-color: var(--accent); }
  .photo-pick input { display: none; }
  .photo-state { margin-top: 9px; font-size: 11.5px; color: var(--text-muted); }
  .photo-state.warn { color: var(--yellow); }
  .photo-state.err { color: var(--red); }
  .photo-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .photo-thumbs figure { margin: 0; position: relative; }
  .photo-thumbs img {
    width: 62px; height: 62px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--border); display: block;
  }
  /* A photo still waiting for signal looks like one: dimmed, with the count in
     the line above saying why. */
  .photo-thumbs figure.queued img { opacity: 0.45; }
  .photo-thumbs .kill {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; border: 1px solid var(--border-bright); background: var(--bg);
    color: var(--text-muted); font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  }
  .photo-thumbs .kill:hover { color: var(--red); border-color: var(--red); }

  /* runner cards */
  .runners { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 22px; }
  .runner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; position: relative;
    transition: border-color 0.3s ease;
  }
  .runner.course { border-color: rgba(15, 184, 191, 0.5); }
  .runner.pit    { border-color: rgba(110, 231, 168, 0.4); }
  .runner.done   { border-color: rgba(138, 169, 208, 0.4); }
  .runner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--border); transition: background 0.3s ease;
  }
  .runner.course::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .runner.pit::before    { background: linear-gradient(90deg, var(--green), transparent); }
  .runner.done::before   { background: linear-gradient(90deg, var(--blue), transparent); }

  .runner-head {
    padding: 16px 20px 12px; display: flex;
    justify-content: space-between; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .runner-name {
    font-family: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif; font-size: 24px;
    font-weight: 600; letter-spacing: -0.02em;
  }
  .state-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px; border: 1px solid currentColor;
  }
  .state-course { color: var(--accent); }
  .state-pit    { color: var(--green); }
  .state-idle   { color: var(--text-muted); }
  .state-done   { color: var(--blue); }

  .where {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-dim);
  }
  .where strong { color: var(--text); }
  .where .arrow { color: var(--text-muted); margin: 0 6px; }

  .state-timer {
    padding: 14px 20px; display: flex; justify-content: space-between;
    align-items: baseline; border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
  }
  .state-timer .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);
  }
  .state-timer .value {
    font-family: 'JetBrains Mono', monospace; font-size: 22px;
    font-weight: 700; letter-spacing: -0.02em;
  }
  .runner.course .state-timer .value { color: var(--accent); }
  .runner.pit    .state-timer .value { color: var(--green); }

  .big-btn {
    display: block; width: 100%;
    padding: 24px 16px;
    background: var(--bg-elevated);
    color: var(--text); border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; user-select: none;
    line-height: 1.3;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .big-btn:hover { background: #1f2a33; }
  .big-btn:active { transform: scale(0.98); background: #2a2e38; }
  .big-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .big-btn.out {
    background: linear-gradient(180deg, rgba(15, 184, 191, 0.18), rgba(15, 184, 191, 0.06));
    color: var(--accent);
  }
  .big-btn.in {
    background: linear-gradient(180deg, rgba(110, 231, 168, 0.18), rgba(110, 231, 168, 0.06));
    color: var(--green);
  }

  /* intake panel */
  .intake-panel {
    padding: 16px 20px; border-top: 1px solid var(--border);
  }
  .intake-panel-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 12px;
  }
  .intake-panel-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
  }
  .intake-panel select {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 6px 10px; width: auto; min-width: 180px;
  }
  .intake-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px;
  }
  @media (max-width: 480px) { .intake-grid { grid-template-columns: 1fr; } }
  .intake-grid label { font-size: 10px; letter-spacing: 0.15em; }
  .intake-notes textarea {
    min-height: 60px; resize: vertical; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; font-size: 13px;
  }
  .intake-times {
    display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -4px 0 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim);
  }
  .intake-times .k {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted); margin-right: 4px;
  }
  .intake-times .missing { color: var(--yellow); }

  .intake-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .intake-presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
  .preset-chip {
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text); border-radius: 999px; padding: 7px 12px;
    font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1;
    min-height: 34px;
  }
  .preset-chip:hover { border-color: var(--accent); color: var(--accent); }
  .preset-chip:active { transform: translateY(1px); }

  .racer-switch {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 16px; padding: 10px 14px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 4px;
    font-size: 13px; color: var(--text-dim);
  }
  .racer-switch strong { color: var(--text); }

  .toast {
    position: fixed; bottom: calc(20px + var(--so-offline-h, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border-bright);
    color: var(--text); padding: 10px 16px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 50;
  }
  .toast.error { color: var(--red); border-color: var(--red); }
  .toast.ok { color: var(--green); border-color: rgba(110,231,168,0.4); }
</style>

<script src="lib/race-core.js?v=92"></script>
<script>
  const slug = Race.qs('id');
  if (!slug) { window.location = '/app/'; }

  // The other pages of this race, and the hub. Seeded without edit rights so
  // the menu works before config.json lands; refined once it does.
  Race.nav.setRace(slug, 'pit', false);

  const CONFIG_PATH = `races/${slug}/config.json`;
  const DATA_PATH   = `races/${slug}/data.json`;

  let cfg = null, data = null;
  // Reading a file back straight after writing it is the one thing that does
  // not work: neither Pages nor GitHub's contents API is read-after-write
  // consistent, so the poll that follows a save can hand back the version from
  // before it and undo the edit on screen. The writer already knows what it
  // wrote, so it says so, and polls are ignored for long enough that the far
  // side has certainly caught up.
  const CONFIG_SETTLE_MS = 20000;
  let configWrittenUntil = 0;

  function adoptConfig(written) {
    if (!written) return;
    cfg = written;
    configWrittenUntil = Date.now() + CONFIG_SETTLE_MS;
    render();
  }
  let stickyIntakeLegByRunner = {}; // runnerId -> selected legIndex

  // ---------- toast ----------
  function toast(text, kind) {
    const t = document.getElementById('toast');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = text;
    t.style.display = '';
    clearTimeout(toast._h);
    toast._h = setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  // ---------- connection ----------
  // ---------- press button (sign in/out) ----------
  async function press(runnerId) {
    // Working is the answer to "have you read this".
    Race.tutorial.dismiss();
    // The shared modal, the same one the header offers. This page carried its
    // own sign-in form and its own copy of the account status, and both said
    // what the header already says.
    if (!Race.auth.has()) { toast('Sign in first.', 'error'); Race.openSigninModal(); return; }
    const runner = (data.runners || []).find(r => r.id === runnerId);
    if (!runner) { toast(`Runner "${runnerId}" not in data.json`, 'error'); return; }
    const next = Race.compute.nextActionFor(runner, cfg);
    if (!next.nextAction) { toast(`${runnerId} has finished.`, 'ok'); return; }
    const now = new Date().toISOString();

    // A checkpoint is passed, not worked. Arriving at one closes the leg and
    // starts the next in the same instant, so a runner is never shown sitting
    // in a pit that does not exist and does not have to press twice going by.
    const st = Race.stationAt(cfg, next.nextLegIndex);
    const throughCheckpoint = next.nextAction === 'in' && st && st.checkpoint
                              && next.nextLegIndex < Race.course.legCount(cfg);

    // Optimistic local update
    const legFor = (idx) => {
      let l = (runner.legs || []).find(x => x.index === idx);
      if (!l) {
        l = { index: idx };
        runner.legs = (runner.legs || []).concat([l]).sort((a, b) => a.index - b.index);
      }
      return l;
    };
    legFor(next.nextLegIndex)[next.nextAction === 'out' ? 'startTime' : 'endTime'] = now;
    if (throughCheckpoint) legFor(next.nextLegIndex + 1).startTime = now;
    render();

    // Commit. Both halves of a checkpoint go in one entry so they can never be
    // split by a signal that drops between them.
    const legs = { [next.nextLegIndex]: { [next.nextAction === 'out' ? 'startTime' : 'endTime']: now } };
    if (throughCheckpoint) legs[next.nextLegIndex + 1] = { startTime: now };

    const what = throughCheckpoint
      ? `through checkpoint · leg ${next.nextLegIndex}`
      : `${next.nextAction === 'out' ? 'sent off' : 'checked in'} · leg ${next.nextLegIndex}`;
    try {
      const r = await Race.queue.write(DATA_PATH, 'setLegTimes', { runnerId, legs },
        `pit: ${runner.name || runnerId} sign-${next.nextAction} leg ${next.nextLegIndex}`);
      toast(r.queued ? `No signal · ${what} saved on this phone` : `Saved · ${what}`, 'ok');
    } catch (err) {
      toast(`Save failed: ${err.message}`, 'error');
    }
    await load();
  }

  // ---------- edit event time ----------
  async function editEventTime(runnerId, legIndex, field) {
    const runner = (data.runners || []).find(r => r.id === runnerId);
    const leg = runner && (runner.legs || []).find(l => l.index === legIndex);
    if (!leg) return;
    const other = field === 'startTime' ? leg.endTime : leg.startTime;
    // A time that was never recorded still needs a day to sit on: the leg's
    // other end if it has one, otherwise the race start, otherwise today.
    const base = new Date(leg[field] || other || cfg.startTime || Date.now());
    const pad = n => String(n).padStart(2, '0');
    const seed = leg[field] ? new Date(leg[field]) : new Date();
    const input = prompt(
      `${leg[field] ? 'Edit' : 'Set'} ${field === 'startTime' ? 'send-off' : 'arrival'} (24h, HH:MM or HH:MM:SS):`,
      `${pad(seed.getHours())}:${pad(seed.getMinutes())}:${pad(seed.getSeconds())}`
    );
    if (!input) return;
    const m = input.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (!m) { alert('Bad format. Use HH:MM or HH:MM:SS.'); return; }
    const next = new Date(base);
    next.setHours(+m[1], +m[2], +(m[3] || 0), 0);
    // A clock time has no day on it, and this race runs through two nights.
    // Leaving 00:30 on the day of a 23:50 send-off would read as a leg that
    // finished twenty-three hours before it started, so the day follows the
    // only reading that makes sense against the leg's other end.
    if (field === 'endTime' && leg.startTime && next < new Date(leg.startTime)) {
      next.setDate(next.getDate() + 1);
    } else if (field === 'startTime' && leg.endTime && next > new Date(leg.endTime)) {
      next.setDate(next.getDate() - 1);
    }
    const iso = next.toISOString();
    try {
      const r = await Race.queue.write(DATA_PATH, 'setLegTimes',
        { runnerId, legs: { [legIndex]: { [field]: iso } } },
        `pit: edit ${runnerId} leg ${legIndex} ${field}`);
      toast(r.queued ? 'No signal · time saved on this phone' : 'Time saved', 'ok');
      await load();
    } catch (err) { toast(`Save failed: ${err.message}`, 'error'); }
  }

  async function deleteLastEvent(runnerId) {
    if (!confirm('Undo the last check-in or send-off for this runner?')) return;
    const runner = (data.runners || []).find(r => r.id === runnerId);
    if (!runner || !runner.legs?.length) return;
    const sorted = runner.legs.slice().sort((a, b) => a.index - b.index);
    const last = sorted[sorted.length - 1];
    // Pick the field with the later timestamp; if only one is set, clear that.
    const hasIn  = !!last.endTime;
    const hasOut = !!last.startTime;
    let field, deleteWholeLeg = false;
    if (hasIn && hasOut) field = 'endTime';
    else if (hasOut) { field = 'startTime'; deleteWholeLeg = true; }
    else return;

    try {
      const r = deleteWholeLeg
        ? await Race.queue.write(DATA_PATH, 'removeLeg', { runnerId, legIndex: last.index },
            `pit: undo ${runnerId} leg ${last.index}`)
        : await Race.queue.write(DATA_PATH, 'clearLegField', { runnerId, legIndex: last.index, field },
            `pit: undo ${runnerId} leg ${last.index}`);
      toast(r.queued ? 'No signal · undo saved on this phone' : 'Undone', 'ok');
      await load();
    } catch (err) { toast(`Undo failed: ${err.message}`, 'error'); }
  }

  // ---------- intake editor ----------
  // Adds a preset's numbers to the boxes without saving. Two flasks is two
  // taps, and a wrong tap is fixed by editing the number rather than by an
  // undo the crew has to find.
  function applyPreset(runnerId, presetIndex) {
    const card = document.querySelector(`.runner[data-runner="${runnerId}"]`);
    const preset = Race.fuel.presets(cfg)[presetIndex];
    if (!card || !preset) return;
    for (const m of Race.fuel.metrics(cfg)) {
      const add = +preset.values[m.key];
      if (!add) continue;
      const el = card.querySelector(`[data-intake="${m.key}"]`);
      if (!el) continue;
      el.value = Race.fuel.round(m, (parseFloat(el.value) || 0) + add);
    }
    toast(`Added ${preset.name}. Save intake to keep it.`, 'ok');
  }

  async function saveIntake(runnerId) {
    const sel = document.querySelector(`select[data-intake-leg][data-runner="${runnerId}"]`);
    const legIndex = sel ? +sel.value : null;
    if (!legIndex) return;
    const card = document.querySelector(`.runner[data-runner="${runnerId}"]`);
    const get = name => {
      const el = card.querySelector(`[data-intake="${name}"]`);
      return el ? el.value.trim() : '';
    };
    const metrics = Race.fuel.metrics(cfg);
    const amounts = metrics.map(m => [m, get(m.key)]);
    const notes  = get('notes');
    const issues = get('issues');
    const meds   = get('meds');
    const gear   = get('gearChanges');

    // null means "clear it", which is how an emptied box is told apart from one
    // that was never filled in.
    const fields = {};
    for (const [m, v] of amounts) fields[m.key] = v === '' ? null : Race.fuel.round(m, v);
    fields.notes       = notes  === '' ? null : notes;
    fields.issues      = issues === '' ? null : issues;
    fields.meds        = meds   === '' ? null : meds;
    fields.gearChanges = gear   === '' ? null : gear;

    try {
      const r = await Race.queue.write(DATA_PATH, 'setLegFields', { runnerId, legIndex, fields },
        `pit: intake ${runnerId} leg ${legIndex}`);
      toast(r.queued
        ? `No signal · intake for leg ${legIndex} saved on this phone`
        : `Intake saved · leg ${legIndex}`, 'ok');
      // Forced: the boxes still hold what was just sent, so they read as
      // unsaved until this redraw replaces them with what landed.
      await load(true);
    } catch (err) { toast(`Save failed: ${err.message}`, 'error'); }
  }

  // ---------- render ----------
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  function whereLine(runner, next) {
    // legAt().name reads correctly for every course shape: "Start → Cabin"
    // (segments), "Lap 3" (simple loop), "Lap 3 · Cabin → Ridge" (loop+aids).
    if (next.state === 'idle') {
      const first = Race.course.legAt(cfg, 1);
      if (!first) return 'Race not configured yet';
      return `Ready: <strong>${escapeHtml(first.name)}</strong>`;
    }
    if (next.state === 'finished') return 'Finished';
    const def = Race.course.legAt(cfg, next.currentLegIndex);
    if (!def) return `Leg ${next.currentLegIndex}`;
    if (next.state === 'on-course') {
      return `On course: <strong>${escapeHtml(def.name)}</strong>`;
    }
    const nextDef = Race.course.legAt(cfg, next.nextLegIndex);
    return `In pit · next: <strong>${escapeHtml(nextDef ? nextDef.name : '?')}</strong>`;
  }

  // The two times the selected leg actually holds, to the second. A press that
  // went in a minute late, or one that never went in at all, is the thing a
  // crew is scanning for, and neither shows up in a duration.
  function legTimesLine(leg) {
    if (!leg) return '';
    const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    const cell = (label, ts) => ts
      ? `<span><span class="k">${label}</span> ${escapeHtml(clock(ts))}</span>`
      : `<span class="missing"><span class="k">${label}</span> not recorded</span>`;
    const dur = (leg.startTime && leg.endTime)
      ? `<span><span class="k">Leg</span> ${Race.fmt.duration((new Date(leg.endTime) - new Date(leg.startTime)) / 1000)}</span>`
      : (leg.startTime ? '<span class="k">still out</span>' : '');
    return `<div class="intake-times">${cell('Out', leg.startTime)}${cell('In', leg.endTime)}${dur}</div>`;
  }

  function renderRunner(runner) {
    const next = Race.compute.nextActionFor(runner, cfg);
    let stateClass = next.state === 'on-course' ? 'course' :
                     next.state === 'in-pit'    ? 'pit'    :
                     next.state === 'finished'  ? 'done'   : 'idle';
    let stateLabel = next.state === 'on-course' ? 'On Course' :
                     next.state === 'in-pit'    ? 'In Pit'    :
                     next.state === 'finished'  ? 'Finished'  : 'Not Started';

    let buttonAction = next.nextAction;
    let buttonLabel = '–', buttonDisabled = false;
    if (next.state === 'finished') {
      buttonLabel = 'Finished'; buttonDisabled = true;
    } else if (next.state === 'on-course') {
      const def = Race.course.legAt(cfg, next.currentLegIndex);
      const st = Race.stationAt(cfg, next.currentLegIndex);
      buttonLabel = st && st.checkpoint
        ? (st.name ? `Checkpoint Reached · ${st.name}` : 'Checkpoint Reached')
        : (def && def.toAid ? `Check In at ${def.toAid}` : `Check In · End ${def ? def.name : 'leg'}`);
    } else if (next.state === 'in-pit') {
      const def = Race.course.legAt(cfg, next.nextLegIndex);
      buttonLabel = def && def.toAid
        ? `Send Off · ${def.fromAid || '?'} → ${def.toAid}`
        : `Send Off · Start ${def ? def.name : 'leg'}`;
    } else {
      const def = Race.course.legAt(cfg, 1);
      buttonLabel = def && def.toAid
        ? `Send Off · Start (${def.toAid})`
        : `Send Off · Start ${def ? def.name : 'Lap 1'}`;
    }

    // lastTs is the moment the current state began, which for a finished racer
    // is the moment they finished. Counting from it gave "Total since start"
    // ticking up forever: on Six-0 it read 89 hours, which was the time since
    // the finish rather than the time it took. A finished race has a total, and
    // a total does not move, so it is rendered once and left alone.
    const done = next.state === 'finished';
    const finishedSec = done ? Race.compute.runner(runner, cfg).completedRaceSec : null;
    const since = done ? '' : (next.lastTs || '');
    const timerLabel = next.state === 'on-course' ? 'On course for'
                     : next.state === 'in-pit'    ? 'In pit for'
                     : done                       ? 'Total race time' : 'Awaiting start';

    // Intake panel: every leg that has been started, finished or not. A leg in
    // progress belongs here because the send-off that began it is the thing
    // most likely to need correcting: a crew watching a start rather than
    // holding a phone presses a minute or two late, and until now there was
    // nowhere to fix that until the runner had arrived somewhere.
    const panelLegs = (runner.legs || []).filter(l => l.startTime || l.endTime).sort((a, b) => b.index - a.index);
    const stickyIdx = stickyIntakeLegByRunner[runner.id];
    const selectedLegIdx = (stickyIdx && panelLegs.find(l => l.index === stickyIdx))
      ? stickyIdx
      : (panelLegs[0]?.index || null);
    const selectedLeg = panelLegs.find(l => l.index === selectedLegIdx);

    const legOptions = panelLegs.map(l => {
      const def = Race.course.legAt(cfg, l.index);
      const labelText = (def && def.name) ? def.name : `Leg ${l.index}`;
      // Said plainly, so nobody wonders why this one has no times to edit yet.
      const running = !l.startTime ? ' · no send-off' : (l.endTime ? '' : ' · running');
      return `<option value="${l.index}" ${l.index === selectedLegIdx ? 'selected' : ''}>${escapeHtml(labelText)}${running}</option>`;
    }).join('');

    // One tap per flask or gel: the preset adds its numbers to whatever is
    // already in the boxes, so a crew member counts servings instead of doing
    // arithmetic at an aid station.
    const fuelMetrics = Race.fuel.metrics(cfg);
    const presets = Race.fuel.presets(cfg).filter(p => fuelMetrics.some(m => +p.values[m.key]));
    const presetBtns = presets.length === 0 ? '' : `
        <div class="intake-presets">
          ${presets.map((p, i) => `<button type="button" class="preset-chip" data-action="preset"
             data-runner="${runner.id}" data-preset="${i}"
             title="${escapeAttr(fuelMetrics.filter(m => +p.values[m.key])
                     .map(m => Race.fuel.fmt(m, p.values[m.key]) + ' ' + m.short).join(' · '))}"
             >+ ${escapeHtml(p.name)}</button>`).join('')}
        </div>`;

    const intakePanel = panelLegs.length === 0 ? '' : `
      <div class="intake-panel">
        <div class="intake-panel-head">
          <span class="intake-panel-title">Intake / notes</span>
          <select data-intake-leg data-runner="${runner.id}">${legOptions}</select>
        </div>
        ${legTimesLine(selectedLeg)}
        ${fuelMetrics.length ? `<div class="intake-grid">
          ${fuelMetrics.map(m => `
          <label class="field">
            <span class="lbl">${escapeHtml(Race.fuel.fieldLabel(m))}</span>
            <input type="number" data-intake="${escapeAttr(m.key)}" min="0" step="${m.step}" value="${selectedLeg?.[m.key] ?? ''}" />
          </label>`).join('')}
        </div>` : ''}
        ${presetBtns}
        <label class="field intake-notes">
          <span class="lbl">Notes</span>
          <textarea data-intake="notes">${escapeHtml(selectedLeg?.notes ?? '')}</textarea>
        </label>
        <div class="grid-3" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
          <label class="field">
            <span class="lbl">Issues</span>
            <input type="text" data-intake="issues" value="${escapeAttr(selectedLeg?.issues ?? '')}" />
          </label>
          <label class="field">
            <span class="lbl">Meds</span>
            <input type="text" data-intake="meds" value="${escapeAttr(selectedLeg?.meds ?? '')}" />
          </label>
          <label class="field">
            <span class="lbl">Gear</span>
            <input type="text" data-intake="gearChanges" value="${escapeAttr(selectedLeg?.gearChanges ?? '')}" />
          </label>
        </div>
        <div class="intake-actions">
          <button class="btn primary" data-action="save-intake" data-runner="${runner.id}">Save intake</button>
          <button class="btn" data-action="edit-time" data-runner="${runner.id}" data-leg="${selectedLeg?.index || ''}" data-field="startTime">${selectedLeg?.startTime ? 'Edit' : 'Set'} start time</button>
          <button class="btn" data-action="edit-time" data-runner="${runner.id}" data-leg="${selectedLeg?.index || ''}" data-field="endTime">${selectedLeg?.endTime ? 'Edit' : 'Set'} end time</button>
        </div>
      </div>
    `;

    return `
      <article class="runner ${stateClass}" data-runner="${runner.id}">
        <div class="runner-head">
          <div class="runner-name">${escapeHtml(runner.name)}</div>
          <div class="state-badge state-${stateClass}">${stateLabel}</div>
        </div>
        <div class="where">${whereLine(runner, next)}</div>
        <div class="state-timer" data-since="${since}"${done ? ` data-elapsed="${finishedSec}"` : ''}>
          <span class="label">${timerLabel}</span>
          <span class="value runner-timer">–</span>
        </div>
        <button class="big-btn ${buttonAction || ''}" data-action="press" data-runner="${runner.id}" ${buttonDisabled ? 'disabled' : ''}>${escapeHtml(buttonLabel)}</button>
        <div style="display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elevated);">
          <button class="btn" data-action="undo" data-runner="${runner.id}">Undo last</button>
        </div>
        ${intakePanel}
      </article>
    `;
  }

  // True when anything in an intake panel has been typed into and not yet
  // saved. Worked out from the DOM rather than tracked with a flag, so it
  // clears itself the moment the text goes back to what was rendered, and
  // there is no state to get stuck on.
  function intakeDirty() {
    return [...document.querySelectorAll('#runners [data-intake]')]
      .some(el => el.value !== (el.dataset.rendered ?? ''));
  }

  // The ten second poll rebuilds every card's innerHTML, which used to throw
  // away whatever a crew member was in the middle of typing. Worse than losing
  // it: an emptied box means "clear this field", so saving after a wipe
  // deleted the note that was already there.
  //
  // So a poll-driven render stands down while there are unsaved edits. Anything
  // the person actually asked for (switching legs, saving) passes force and
  // redraws regardless. The cost is that the whole board pauses while somebody
  // types, rather than just their card; with a full field of racers that is
  // worth splitting, but not days before a race.
  function render(force) {
    if (!cfg || !data) return;
    if (!force && intakeDirty()) return;
    const runnersById = new Map((cfg.runners || []).map(r => [r.id, r]));
    const merged = (cfg.runners || []).map(r => {
      const dr = (data.runners || []).find(d => d.id === r.id) || { id: r.id, legs: [] };
      return { ...r, ...dr };
    });
    document.getElementById('runners').innerHTML = merged.map(renderRunner).join('');
    // What each field was drawn with. Anything different later is a person's
    // unsaved typing.
    document.querySelectorAll('#runners [data-intake]')
      .forEach(el => { el.dataset.rendered = el.value; });
    tick();
    updateLastUpdatedLabel();
  }

  // ---------- racer mode ----------
  // Someone running this race wants the racer screen, not the crew board. The
  // clock decides the default: before the start there is nothing to log and
  // this page is where a race gets set up, so the switch only happens once it
  // is under way. It is a default and never a lock: choosing the crew board
  // here is remembered for this race on this device.
  const MODE_KEY = `sendoff-mode-${slug}`;

  function myRunner() {
    const runners = (cfg && cfg.runners) || [];
    const me = (Race.auth.email() || '').toLowerCase();
    if (!me) return null;
    const mine = runners.filter(r => String(r.email || '').toLowerCase() === me);
    return mine.length === 1 ? mine[0] : null;
  }

  function raceStarted() {
    if (!cfg || !cfg.startTime) return false;
    return Date.now() >= new Date(cfg.startTime).getTime();
  }

  function maybeOfferRacerMode() {
    const mine = myRunner();
    if (!mine) return;
    let mode = null;
    try { mode = localStorage.getItem(MODE_KEY); } catch (e) {}
    // At most once per tab, so opening the app lands you on the racer screen
    // but coming back here deliberately, later, stays here. Without that the
    // two pages would bounce a runner between them.
    let bounced = false;
    try { bounced = sessionStorage.getItem(`sendoff-bounced-${slug}`) === '1'; } catch (e) {}
    if (mode !== 'crew' && !bounced && raceStarted()) {
      try { sessionStorage.setItem(`sendoff-bounced-${slug}`, '1'); } catch (e) {}
      // replace, not assign: the back button should not land back here and go
      // round again.
      location.replace(`racer.html?id=${encodeURIComponent(slug)}`);
      return;
    }
    showRacerSwitch(mine);
  }

  function showRacerSwitch(mine) {
    if (document.getElementById('racer-switch')) return;
    const bar = document.createElement('div');
    bar.id = 'racer-switch';
    bar.className = 'racer-switch';
    bar.innerHTML = `<span>You are running this as <strong>${escapeHtml(mine.name || mine.id)}</strong>.</span>` +
      `<button class="btn" type="button" id="to-racer">Racer screen</button>`;
    const anchorEl = document.getElementById('runners');
    anchorEl.parentNode.insertBefore(bar, anchorEl);
    document.getElementById('to-racer').addEventListener('click', () => {
      try { localStorage.setItem(MODE_KEY, 'racer'); } catch (e) {}
      location.href = `racer.html?id=${encodeURIComponent(slug)}`;
    });
  }

  // ---------- tick / data ----------
  function tick() {
    document.querySelectorAll('.runner').forEach(card => {
      const timerEl = card.querySelector('.state-timer');
      const valueEl = card.querySelector('.runner-timer');
      const since = timerEl?.dataset.since;
      // A fixed total, for a race that is over. Set instead of data-since, so
      // there is nothing here that could start counting again.
      const fixed = timerEl?.dataset.elapsed;
      if (!since) {
        if (valueEl) valueEl.textContent = fixed ? Race.fmt.duration(+fixed) : '–';
        return;
      }
      const seconds = (Date.now() - new Date(since).getTime()) / 1000;
      if (valueEl) valueEl.textContent = Race.fmt.duration(seconds);
    });
  }

  function updateLastUpdatedLabel() {
    if (!data) return;
    const lu = data.lastUpdated
      ? `Updated ${new Date(data.lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
      : 'Awaiting start';
    document.getElementById('last-updated').textContent = lu;
  }

  async function load(force) {
    try {
      // data.json reads through the worker when signed in (GitHub API, no
      // Pages rebuild lag) so a pit press shows on other devices within a poll.
      //
      // config.json off Pages is a CDN in front of a site that rebuilds after
      // each commit, so it runs a minute or so behind a write. Anyone signed in
      // is a potential editor of this page, and reloading is the first thing
      // someone does when unsure whether a save took, so a signed-in reader
      // gets config through the worker from the very first load rather than
      // only after this tab has written something. A reader with no account
      // cannot edit anything and is happy with the CDN copy.
      const [c, d] = await Promise.all([
        Race.gh.readRaceJson(slug, 'config.json', Race.auth.has()),
        Race.gh.readRaceJson(slug, 'data.json', true)
      ]);
      // Within the settle window the copy we wrote wins, because a read that
      // arrives stale would put the old value back on screen.
      if (Date.now() >= configWrittenUntil) cfg = c;
      // Now that the roster is known, the pit board can appear for whoever is
      // allowed to work it.
      Race.nav.setRace(slug, 'pit', () => Race.roles.canEdit(cfg, Race.auth.email()));
      // Anything still waiting to sync is replayed on top of what came back,
      // so a check-in made with no signal reads as done rather than vanishing
      // on the next poll. Survives a reload too, which matters when the phone
      // is in a vest pocket and the browser drops the tab.
      data = Race.queue.applyTo(DATA_PATH, d);
      document.title = `Pit · ${cfg.name}`;
      document.getElementById('race-title').textContent = cfg.name;
      document.getElementById('error').style.display = 'none';
      maybeOfferRacerMode();
      render(force);
      renderPhotos();
    } catch (err) {
      const e = document.getElementById('error');
      e.style.display = 'block';
      e.textContent = `Error: ${err.message}`;
    }
  }

  // ---------- wire-up ----------
  document.body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const action = t.dataset.action;
    if (action === 'press') press(t.dataset.runner);
    else if (action === 'undo') deleteLastEvent(t.dataset.runner);
    else if (action === 'save-intake') saveIntake(t.dataset.runner);
    else if (action === 'preset') applyPreset(t.dataset.runner, +t.dataset.preset);
    else if (action === 'edit-time') editEventTime(t.dataset.runner, +t.dataset.leg, t.dataset.field);
  });

  document.getElementById('runners').addEventListener('change', (e) => {
    if (e.target.matches('[data-intake-leg]')) {
      stickyIntakeLegByRunner[e.target.dataset.runner] = +e.target.value;
      // Asked for by hand, so it redraws even over an unsaved edit: choosing
      // another leg is choosing to look at another leg.
      render(true);
    }
  });

  // hub.json first: it carries the worker address, and the account widget in
  // the header cannot say who you are until it has landed.
  // What this screen says the first time somebody lands on it.
  //
  // The one screen where this had to not be a dialog. Somebody opening the pit
  // board has a runner in front of them and both hands full, and a box between
  // them and the button is worse than no teaching at all. So it sits above the
  // cards, out of the way, and press() puts it away on the first press:
  // whoever has started working has read it or decided not to.
  function registerTutorial(ent) {
    Race.tutorial.register({
      key: 'pit',
      version: 2,
      where: '#tut-host',
      title: 'Working the pit board',
      // Three short lines, not four longer ones. At four this pushed the first
      // racer's button off the bottom of a phone, which on this screen is the
      // failure: somebody has to scroll past the explanation to reach the
      // thing it is explaining.
      points: [
        'One button per racer, and it alternates. <b>Send Off</b> when they ' +
          'leave, <b>Check In</b> when they reach you.',
        'Fluids, food and notes go in afterwards. None of it is needed to log ' +
          'a split.',
        '<b>Undo last</b> fixes a wrong press. ' + Race.plans.offlineNote(ent)
      ]
    });
  }

  // ---------- photos ----------
  // A photo belongs to a leg of the course, not to a racer: the aid station
  // itself, or two of your runners standing together, is not any one person's.
  // runnerId is there as an optional tag and the picker offers it second.
  //
  // The leg defaults to where the race actually is. A crew member at an aid
  // station photographs what is in front of them, and making them find the
  // right leg in a list of sixteen before they can take a picture is how the
  // picture does not get taken.
  let photoRows = [], photoQueued = [];
  // Shut on arrival. Everything on this screen competes with the button
  // somebody came to press, and the pit board is opened with a runner in front
  // of you far more often than it is opened to add a photograph.
  //
  // Kept across renders rather than across loads: the board redraws every five
  // seconds, and a section that folded itself up mid-caption would be unusable.
  // A reload starts closed again, which is the right default to return to.
  let photosOpen = false;

  function defaultLegIndex() {
    if (!cfg || !data) return 1;
    const merged = Race.queue.applyTo(DATA_PATH, JSON.parse(JSON.stringify(data))).runners || [];
    for (const r of merged) {
      const next = Race.compute.nextActionFor(r, cfg);
      if (next.state === 'on-course' && next.currentLegIndex) return next.currentLegIndex;
      if (next.nextLegIndex) return next.nextLegIndex;
    }
    return Race.course.legCount(cfg) || 1;
  }

  function canWorkPit() { return Race.roles.canEdit(cfg, Race.auth.email()); }

  async function refreshPhotos() {
    try { photoRows = await Race.media.list(slug); } catch (e) { photoRows = []; }
    try { photoQueued = await Race.media.pending(slug); } catch (e) { photoQueued = []; }
    renderPhotos();
  }

  // Built once, then updated in place. It used to rebuild its own innerHTML on
  // every poll, which is five seconds, and that quietly broke the whole thing:
  // tapping Add photo opens the operating system's picker, the picker stays up
  // for longer than five seconds, a poll replaces the <input type="file"> while
  // it is up, and the picker hands the photo back to an element that is no
  // longer in the document. The change event fires on a detached node, never
  // reaches the delegated listener on the section, and nothing happens at all:
  // no thumbnail, no error, no queue entry. Airplane mode made it certain
  // rather than occasional, because everything takes longer with no signal.
  //
  // render() above already carries the same lesson for the intake fields, in
  // the comment about the poll throwing away what somebody was typing. The
  // file input is worse than a text field: a text field loses its contents and
  // the person sees it, and this lost the photograph and said nothing.
  //
  // So nothing in the body is ever replaced. The head, the state line and the
  // thumbnails are updated; the selects are only rebuilt when the course or
  // the roster actually changed, keeping the choice; the caption and the file
  // input are never touched at all.
  let photoSkeleton = false, photoLegSig = '', photoRunnerSig = '', photoThumbUrls = [];

  function buildPhotoSkeleton(host) {
    host.innerHTML =
      `<button type="button" class="photo-head" id="photo-toggle" aria-expanded="false"` +
        ` aria-controls="photo-body">` +
        `<span>Photos</span>` +
        `<span class="photo-head-right"><span id="photo-summary"></span>` +
        `<span class="photo-head-caret"></span></span>` +
      `</button>` +
      `<div class="photo-body" id="photo-body" hidden>` +
        `<div class="photo-row">` +
          `<select id="photo-leg" aria-label="Which leg"></select>` +
          `<select id="photo-runner" aria-label="Who is in it"></select>` +
        `</div>` +
        `<div class="photo-row">` +
          `<input type="text" id="photo-caption" maxlength="280" placeholder="A line about it (optional)">` +
          `<label class="photo-pick">Add photo` +
            `<input type="file" id="photo-file" accept="image/*" multiple></label>` +
        `</div>` +
        `<div class="photo-state" id="photo-state"></div>` +
        `<div class="photo-thumbs" id="photo-thumbs"></div>` +
      `</div>`;
    wirePhotos(host);
  }

  function renderPhotos() {
    const host = document.getElementById('photos');
    if (!host || !cfg) return;
    // Crew only. Everything the roadmap says about moderation starts the
    // moment somebody not on the roster can put a picture on the page.
    if (!canWorkPit()) { host.style.display = 'none'; return; }
    // And only where photos can actually land. This shipped ahead of the
    // worker that takes them once, and the board offered a camera whose every
    // upload could only fail, on the one screen where a thing that does not
    // work costs somebody a race.
    if (Race.media.configured() !== true) { host.style.display = 'none'; return; }
    host.style.display = '';
    if (!photoSkeleton) { photoSkeleton = true; buildPhotoSkeleton(host); }

    host.className = 'photo-bar' + (photosOpen ? '' : ' collapsed');
    const body = host.querySelector('#photo-body');
    body.hidden = !photosOpen;
    host.querySelector('#photo-toggle').setAttribute('aria-expanded', String(photosOpen));

    // The selects, only when what goes in them changed. Rebuilding these on
    // the poll would reset a choice somebody had just made.
    const legs = Race.course.legs(cfg) || [];
    const legSig = legs.map(l => l.index + ':' + (l.toAid || '')).join('|');
    const legSel = host.querySelector('#photo-leg');
    if (legSig !== photoLegSig) {
      photoLegSig = legSig;
      const keep = legSel.value || String(defaultLegIndex());
      legSel.innerHTML = legs.map(l =>
        `<option value="${l.index}">Leg ${l.index}${l.toAid ? ' · ' + escapeHtml(l.toAid) : ''}</option>`).join('');
      legSel.value = keep;
      if (!legSel.value) legSel.value = String(defaultLegIndex());
    }
    const runners = cfg.runners || [];
    const runnerSig = runners.map(r => r.id + ':' + (r.name || '')).join('|');
    const runnerSel = host.querySelector('#photo-runner');
    if (runnerSig !== photoRunnerSig) {
      photoRunnerSig = runnerSig;
      const keep = runnerSel.value;
      runnerSel.innerHTML = '<option value="">Nobody in particular</option>' +
        runners.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name || r.id)}</option>`).join('');
      runnerSel.value = keep;
    }

    const waiting = photoQueued.filter(q => !q.failed).length;
    const stuck = photoQueued.filter(q => q.failed);

    // What the head says while the body is shut. The count of photos waiting
    // for signal has to be one of them: a crew member with three unsent
    // pictures should not have to open anything to find that out.
    const summary = host.querySelector('#photo-summary');
    summary.textContent = stuck.length ? `${stuck.length} stuck`
      : waiting ? `${waiting} waiting for signal`
      : `${photoRows.length} on this race`;
    summary.className = stuck.length ? 'photo-head-err' : waiting ? 'photo-head-warn' : '';

    const state = host.querySelector('#photo-state');
    // Left alone while it is saying something about what just happened, which
    // is the one message the poll must not talk over.
    if (!state.dataset.sticky) {
      state.className = 'photo-state' + (stuck.length ? ' err' : waiting ? ' warn' : '');
      state.textContent = stuck.length
        ? `${stuck.length} could not be sent: ${stuck[0].failed || ''}`
        : waiting ? `${waiting} waiting for signal. They go out on their own.`
        : 'Resized on this phone before sending, which takes the location off them too.';
    }

    renderPhotoThumbs(host);
  }

  function renderPhotoThumbs(host) {
    const box = host.querySelector('#photo-thumbs');
    // One object URL per queued photo per render leaks them all otherwise, on
    // a page that renders every five seconds for as long as a hundred miler.
    for (const u of photoThumbUrls) { try { URL.revokeObjectURL(u); } catch (e) {} }
    photoThumbUrls = [];
    const queued = photoQueued.map(q => {
      const u = URL.createObjectURL(q.blob);
      photoThumbUrls.push(u);
      return `<figure class="queued"><img alt="Waiting to send" src="${u}">` +
        `<button class="kill" type="button" data-drop="${escapeHtml(q.id)}" aria-label="Discard">×</button>` +
        `</figure>`;
    }).join('');
    const sent = photoRows.slice().reverse().slice(0, 12).map(m =>
      `<figure><img alt="${escapeHtml(m.caption || 'Race photo')}" src="${escapeHtml(m.url)}">` +
      `<button class="kill" type="button" data-remove="${escapeHtml(m.id)}" aria-label="Delete">×</button>` +
      `</figure>`).join('');
    box.innerHTML = queued + sent;
    box.hidden = !(queued || sent);
  }

  // Says something for a few seconds and stops the poll writing over it.
  function photoSay(text, cls) {
    const state = document.getElementById('photo-state');
    if (!state) return;
    state.className = 'photo-state' + (cls ? ' ' + cls : '');
    state.textContent = text;
    state.dataset.sticky = '1';
    clearTimeout(photoSay._t);
    photoSay._t = setTimeout(() => { delete state.dataset.sticky; renderPhotos(); }, 4000);
  }

  function wirePhotos(host) {
    host.addEventListener('click', (e) => {
      if (!e.target.closest('#photo-toggle')) return;
      photosOpen = !photosOpen;
      renderPhotos();
      // Straight into the leg picker on the way open: the whole section is
      // three controls and the first one is the one that gets changed.
      if (photosOpen) { const l = host.querySelector('#photo-leg'); if (l) l.focus(); }
    });
    host.addEventListener('change', async (e) => {
      if (e.target.id !== 'photo-file') return;
      const files = [...(e.target.files || [])];
      e.target.value = '';
      if (!files.length) return;
      const legIndex = parseInt(host.querySelector('#photo-leg').value, 10);
      const runnerId = host.querySelector('#photo-runner').value || null;
      const caption = host.querySelector('#photo-caption').value || '';
      photoSay(files.length > 1 ? `Preparing ${files.length} photos…` : 'Preparing…');
      let added = 0;
      for (const file of files) {
        try {
          await Race.media.enqueue(slug, { legIndex, runnerId, caption, file });
          added++;
        } catch (err) {
          photoSay(err.message || 'Could not add that photo.', 'err');
          break;
        }
      }
      const box = host.querySelector('#photo-caption');
      if (box) box.value = '';
      await refreshPhotos();
      // Said after the refresh, so it is the last word rather than the first.
      // "Added" and nothing else was the complaint: a photo that queued with
      // no signal looked exactly like one that had not been taken.
      if (added) {
        const waiting = photoQueued.filter(q => !q.failed).length;
        photoSay(waiting
          ? `Added. ${waiting} waiting for signal, and they go out on their own.`
          : `Added.`, waiting ? 'warn' : '');
      }
    });
    host.addEventListener('click', async (e) => {
      const drop = e.target.closest('[data-drop]');
      if (drop) { await Race.media.drop(drop.dataset.drop); return refreshPhotos(); }
      const kill = e.target.closest('[data-remove]');
      if (!kill) return;
      if (!confirm('Delete this photo? It comes off the race page for everybody.')) return;
      try { await Race.media.remove(kill.dataset.remove); } catch (err) {}
      refreshPhotos();
    });
    // A photo that went out while the page was open should stop looking like
    // one that is waiting.
    Race.media.onChange(() => {
      Race.media.pending(slug).then(q => { photoQueued = q; renderPhotos(); });
    });
  }

  (async () => {
    await Race.hub.load();
    // Anything taken with no signal last time goes out now, and the strip
    // fills in once the config says which legs exist.
    Race.media.flush().catch(() => {});
    // Not awaited. What the banner says about logging with no signal depends on
    // the plan, and asking costs a round trip; the board is what somebody came
    // for and it is not waiting on a sentence. Either way it registers: the
    // rejection path in entitlements() answers generously, which is the right
    // way round for a screen somebody opens where the signal is worst.
    Race.plans.entitlements().then(registerTutorial, () => registerTutorial(null));
    await load();
    // The list, once now and once a minute after. Not on the poll: the splits
    // are what need to be fresh every five seconds, and another crew member's
    // photograph arriving a minute late costs nobody anything. Uploads from
    // this phone refresh it straight away, which is the case that is actually
    // noticeable.
    refreshPhotos();
    setInterval(refreshPhotos, 60000);
    // Never forced: see render(). Adaptive, and stopped while the tab is
    // hidden, which is most of the time a phone spends in a vest pocket.
    const poller = Race.poll(() => load(), { interval: () => Race.POLL_MS[Race.raceState(cfg, data)] });
    setInterval(tick, 1000);
    setInterval(updateLastUpdatedLabel, 1000);
    // The push, on top of the poll rather than instead of it. The race page
    // drops to a 60s poll once its socket is up, because a spectator seeing a
    // stale split is a disappointment. Crew acting on one is a different
    // thing, so the interval here does not change at all: this only makes the
    // board faster than 5s, never slower, and a socket that dies quietly costs
    // nothing. Spectators are where the request budget is; crew is where being
    // right is.
    //
    // Last in this block on purpose. Everything above is what the board needs
    // in order to work; this only makes it quicker, and a fault in here should
    // cost the push rather than the clock.
    Race.live(slug, () => poller.now());
  })();
</script>

</body>
</html>
