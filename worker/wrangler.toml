name = "race-dashboard-proxy"
main = "src/worker.js"
compatibility_date = "2026-05-01"

# Non-secret config goes here. Sensitive values are set via
# `wrangler secret put <NAME>` so they never end up in git.
[vars]
GITHUB_OWNER = "SendOffHQ"
GITHUB_REPO = "sendoff"
GITHUB_BRANCH = "main"
# Serve race reads from D1 instead of the GitHub API. "false" (or absent) keeps
# git as the read path. A race the mirror has not seen still falls back to git
# either way, so flipping this on cannot make a race unreadable; flipping it
# back is a one-line change and a deploy, with no data to undo.
READ_FROM_D1 = "true"
# Race writes go to git, and D1 follows. "false" makes D1 the authority for
# races/<slug>/config.json and data.json, and leaves git for the archive.
# Flipped to "false" on 2026-09-10. Setting it back to "true" and deploying is
# the whole rollback: every race is in the mirror, and a race the mirror has
# not seen still falls back to git on the read side either way.
#
# The archive commit that this depends on is in: once a race is finished, the
# worker commits its config and data to git, and again on any correction filed
# afterwards. Finished means every runner through every leg, or the clock past
# the cutoff, because a race somebody dropped out of never satisfies the first
# and is exactly the race whose data you want kept. POST /archive forces it for
# anything the rules miss.
#
# What it does change when it is on, and what to check if it misbehaves: the
# concurrency guard stops being GitHub's blob sha and becomes the config_sha /
# data_sha columns, which a read hands out and a write sends back. A stale one
# is a 409, which is what stops two crew members at the same aid station
# overwriting each other. worker/test/d1-writes.mjs holds that.
#
# course.gpx and races/index.json still go to git either way: one is written
# once at setup, the other is the public manifest the signed-out hub reads.
WRITE_TO_GIT = "false"
# If you mount the worker at a subpath (e.g. on a route like
# api.example.com/race-dashboard/*), set MOUNT_PATH to that prefix.
# Leave empty if the worker is at the root of its hostname.
MOUNT_PATH = ""
# Comma-separated origins allowed by CORS. "*" allows any caller.
# A CORS origin is scheme + host only, never a path.
# www is here because the cutover gave the Pages project both sendoff.run and
# www.sendoff.run, and only the first was on this list. The worker answered
# www's preflight with allow-origin: sendoff.run, the browser rejected it, and
# every authenticated call from www failed with "Failed to fetch". Reads hid it
# by falling back to the published file, so the first thing to show the fault
# was Manage access, which only the worker can answer.
#
# It is a fix, not the fix. Two origins serving one app means two service
# worker registrations, two localStorage buckets and two sessions: sign in on
# one and the other does not know you. A redirect from www to the apex is the
# real answer, and it is a Cloudflare Redirect Rule, because _redirects cannot
# cross hostnames.
#
# The trial host below is temporary:
# take it out at the cutover, or if the trial is abandoned. Without it a
# browser refuses every signed-in call from the trial site, and the trial
# would only be testing the signed-out half. Named exactly, never a
# wildcard over pages.dev, which anybody can get a subdomain of.
ALLOWED_ORIGINS = "https://sendoff.run,https://www.sendoff.run,https://sendoff-abi.pages.dev"
# Public URL of the hub frontend, used when building invite & share URLs.
# The site is served from the root of its domain. If empty, the worker
# falls back to the request's Origin header.
PUBLIC_BASE_URL = "https://sendoff.run"
# Sender for invite mail. Must be an address on a domain this account has
# verified, which Email Routing on sendoff.run already covers.
NOTIFY_FROM = "invites@sendoff.run"
# Sender for everything that is not an invite: password resets and the note to
# the operator. "invites@" on a reset reads like the wrong department answered.
INFO_FROM = "info@sendoff.run"

# Secrets to set with `wrangler secret put`:
#   GITHUB_TOKEN   PAT with Contents: Read and write
#   JWT_SECRET     long random string
#   USERS          JSON array of users, generated by admin/hash.html
#   NOTIFY_EMAIL   where invite and reset requests are announced. Keep it a
#                  secret rather than a var so a personal inbox stays out of
#                  git. Must be a verified Email Routing destination, which is
#                  the free path; without it the worker simply does not notify.
#   DISCORD_WEBHOOK  optional. A channel webhook URL, from Discord's Server
#                  Settings, Integrations, Webhooks. When set, the worker
#                  announces a public race being created and a racer finishing
#                  one. Unset, none of that code runs at all.
#                  It is a secret and not a var for a blunt reason: this
#                  repository is public, and anyone holding a webhook URL can
#                  post to that channel as SendOff. Discord also resets
#                  webhooks it finds in public repositories, so committing it
#                  would break it as well as leak it.
#                  Only races explicitly marked public are ever announced.

# Lets the worker send the notification above. Sending to a verified
# destination address is free on all plans with Email Routing configured.
[[send_email]]
name = "EMAIL"

# ---------------------------------------------------------------------------
# Live push. On since 2026-09-10. The binding is the switch: liveEnabled() is
# just !!env.RACE_HUB, so removing these two blocks turns both /live and the
# publish-after-commit back off, and the worker runs exactly the code it ran
# before. hub.json's "live" is the second switch, on the client side, and
# either one alone is enough to stop it.
#
# Turning it off again is those two blocks and a deploy. The class itself can
# stay: an object with nobody connected to it costs nothing and is not billed.
#
# Cost, from Cloudflare's own billing rules: outgoing WebSocket messages are
# free, so the fan-out is free; incoming are billed at 20:1 and watchers send
# nothing; hibernation means the object sleeps between aid stations. What is
# billed is one request per connection and one per crew press.
#
[[durable_objects.bindings]]
name = "RACE_HUB"
class_name = "RaceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceHub"]
# ---------------------------------------------------------------------------

# KV namespace for invite tokens, share-link tokens, and dynamically
# created (invite-accepted) users. Created with:
#   npx wrangler kv namespace create AUTH_KV
# Without this binding the worker still runs (login/commit/get/access
# work), but /invite, /accept-invite, and /share-link return 503.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "a8c164ca55b14dd08d786a98ced12176"

# Race data. Created with:
#   npx wrangler d1 create sendoff
#
# The id is an identifier, not a credential, so it belongs in git next to the
# KV namespace above. Nothing reads this binding yet; it is here so the schema
# can ship and be applied before any code depends on it.
[[d1_databases]]
binding = "DB"
database_name = "sendoff"
database_id = "e6086753-53c9-4db9-8571-2f8966804bc3"

# To put this worker behind api.sendoff.run, add a custom domain in the
# Cloudflare dashboard or uncomment + edit:
# [[routes]]
# pattern = "api.sendoff.run/*"
# zone_name = "sendoff.run"
