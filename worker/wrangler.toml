name = "race-dashboard-proxy"
main = "src/worker.js"
compatibility_date = "2026-05-01"

# Non-secret config goes here. Sensitive values are set via
# `wrangler secret put <NAME>` so they never end up in git.
[vars]
GITHUB_OWNER = "SendOffHQ"
GITHUB_REPO = "sendoff"
GITHUB_BRANCH = "main"
# Race reads come from D1 whenever D1 is bound, with git as the fallback for a
# race the mirror has never seen. This was a READ_FROM_D1 switch until
# 2026-09-30, removed with the write one below: writes only go to D1, so a
# read that skipped it would find nothing current.
# Race writes go to D1, always. This was a WRITE_TO_GIT switch from 2026-09-10
# to 2026-09-30, and it is gone: its default committed every press to the
# public repository, so losing this one line would have started publishing
# private races' splits with nothing to say so. Git keeps the archive of a
# finished public race, course.gpx for a public race, and races/index.json.
# worker/test/d1-writes.mjs holds that no setting brings git writes back.
# Whether a site admin may open and change a race they are not on.
#
# On unless this says "false", and that one word is the whole of turning it
# off. It is a real widening and privacy.html says so in as many words: an
# admin can read and edit anybody's race, including a private one, and its
# owner is not told. It is on because without it support does not work at all:
# helping somebody with a race meant asking them to add you to it, which the
# person locked out of their own race cannot do.
#
# If this is ever set to "false", privacy.html is the thing to fix in the same
# change. A promise that is quietly too generous is the survivable direction;
# one that is quietly too narrow is not.
ADMIN_RACE_ACCESS = "true"
# Sign in with Google: the OAuth client ID ID tokens must be issued for. Not
# a secret (Google shows it in the button on every page). Empty turns Google
# sign-in off and the button is not drawn. See worker/src/worker.js,
# "sign in with Google".
GOOGLE_CLIENT_ID = ""
# Sign in with Facebook: the Meta app's id. Public (the page's SDK needs it).
# Facebook sign-in also needs FACEBOOK_APP_SECRET, which is a secret and set
# with `wrangler secret put FACEBOOK_APP_SECRET`, never here. Either missing
# turns it off and the button is not drawn.
FACEBOOK_APP_ID = ""
# If you mount the worker at a subpath (e.g. on a route like
# api.example.com/race-dashboard/*), set MOUNT_PATH to that prefix.
# Leave empty if the worker is at the root of its hostname.
MOUNT_PATH = ""
# Comma-separated origins allowed by CORS. "*" allows any caller.
# A CORS origin is scheme + host only, never a path.
# www is here because the cutover gave the Pages project both sendoff.run and
# www.sendoff.run, and only the first was on this list. The worker answered
# www's preflight with allow-origin: sendoff.run, the browser rejected it, and
# every authenticated call from www failed with "Failed to fetch". Reads hid it
# by falling back to the published file, so the first thing to show the fault
# was Manage access, which only the worker can answer.
#
# It is a fix, not the fix. Two origins serving one app means two service
# worker registrations, two localStorage buckets and two sessions: sign in on
# one and the other does not know you. A redirect from www to the apex is the
# real answer, and it is a Cloudflare Redirect Rule, because _redirects cannot
# cross hostnames.
#
# sendoff-abi.pages.dev was here for the hosting trial and came out on
# 2026-09-13, the cutover being long done: the site has been served from
# Cloudflare Pages on the apex since the 10th and nothing signs in from a
# preview host any more. It was named exactly while it was here, never a
# wildcard over pages.dev, which anybody can get a subdomain of. A future
# preview goes back on the same way: by name, and out again afterwards.
ALLOWED_ORIGINS = "https://sendoff.run,https://www.sendoff.run"
# Public URL of the hub frontend, used when building invite & share URLs.
# The site is served from the root of its domain. If empty, the worker
# falls back to the request's Origin header.
PUBLIC_BASE_URL = "https://sendoff.run"
# Sender for invite mail. Must be an address on a domain this account has
# verified, which Email Routing on sendoff.run already covers.
NOTIFY_FROM = "invites@sendoff.run"
# Sender for everything that is not an invite: password resets and the note to
# the operator. "invites@" on a reset reads like the wrong department answered.
INFO_FROM = "info@sendoff.run"
# Where a photo is read from. This is the whole of what stands between an image
# view costing a worker request and costing none, and the budget it protects is
# the 100,000 a day that everything else also draws on: two hundred spectators
# opening a race with twenty photos on it is four thousand requests.
#
# Empty, and reads fall back through the worker's own /media-file, which works
# and is correct and is the thing to move off. Set, and the object comes
# straight off the edge, cached for a year, costing nothing in requests and
# nothing in egress: R2 bills no egress either way, so this buys requests.
#
# It goes here rather than in the dashboard on purpose. A plain-text var set in
# the dashboard is replaced by this file on the next `wrangler deploy`, and
# this worker deploys from CI on every change, so a value typed into the
# dashboard would disappear on somebody else's commit and take the photographs
# with it. It is a public hostname, not a secret, so there is nothing to hide.
#
# Fill it in from R2 -> sendoff-media -> Settings, either the r2.dev subdomain
# or a custom domain such as media.sendoff.run. No trailing slash.
MEDIA_BASE_URL = "https://media.sendoff.run"

# Secrets to set with `wrangler secret put`:
#   GITHUB_TOKEN   PAT with Contents: Read and write
#   JWT_SECRET     long random string
#   USERS          JSON array of users, generated by admin/hash.html
#   NOTIFY_EMAIL   where invite and reset requests are announced. Keep it a
#                  secret rather than a var so a personal inbox stays out of
#                  git. Must be a verified Email Routing destination, which is
#                  the free path; without it the worker simply does not notify.
#   RESEND_API_KEY optional, and the difference between inviting somebody and
#                  asking somebody to paste a link into their own mail client.
#                  Cloudflare Email Routing's send binding, below, only
#                  delivers to addresses verified as destinations on the
#                  account, which is fine for telling the operator something
#                  happened and no use at all for an invite: an invite goes to
#                  a stranger by definition. With this set the worker sends
#                  through Resend instead and can reach anyone.
#                  Set it and sending starts on the next request, no deploy.
#                  Remove it and the binding takes over again, which is the
#                  whole of the rollback. Nothing else changes: the templates,
#                  the from-addresses and every caller are the same either way.
#                  A secret and not a var because it is a credential that can
#                  send mail as this domain, and this repository is public.
#                  From resend.com, after verifying sendoff.run there, which
#                  means adding their DKIM records and adding their include: to
#                  the SPF record already on the domain. Keep the Cloudflare
#                  include as well or inbound forwarding stops working.
#   DISCORD_WEBHOOK  optional. A channel webhook URL, from Discord's Server
#                  Settings, Integrations, Webhooks. When set, the worker
#                  announces a public race being created and a racer finishing
#                  one. Unset, none of that code runs at all.
#                  It is a secret and not a var for a blunt reason: this
#                  repository is public, and anyone holding a webhook URL can
#                  post to that channel as SendOff. Discord also resets
#                  webhooks it finds in public repositories, so committing it
#                  would break it as well as leak it.
#                  Only races explicitly marked public are ever announced.

# Lets the worker send the notification above. Sending to a verified
# destination address is free on all plans with Email Routing configured.
#
# Kept even once RESEND_API_KEY is set, rather than deleted. It costs nothing
# while unused, it depends on nobody outside Cloudflare, and it is what still
# reaches the operator's own inbox if the Resend key is revoked or the free
# tier runs out in the middle of a race. sendMail prefers Resend and falls back
# to this.
[[send_email]]
name = "EMAIL"

# ---------------------------------------------------------------------------
# Live push. On since 2026-09-10. The binding is the switch: liveEnabled() is
# just !!env.RACE_HUB, so removing these two blocks turns both /live and the
# publish-after-commit back off, and the worker runs exactly the code it ran
# before. hub.json's "live" is the second switch, on the client side, and
# either one alone is enough to stop it.
#
# Turning it off again is those two blocks and a deploy. The class itself can
# stay: an object with nobody connected to it costs nothing and is not billed.
#
# Cost, from Cloudflare's own billing rules: outgoing WebSocket messages are
# free, so the fan-out is free; incoming are billed at 20:1 and watchers send
# nothing; hibernation means the object sleeps between aid stations. What is
# billed is one request per connection and one per crew press.
#
[[durable_objects.bindings]]
name = "RACE_HUB"
class_name = "RaceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceHub"]
# ---------------------------------------------------------------------------

# KV namespace for invite tokens, share-link tokens, and dynamically
# created (invite-accepted) users. Created with:
#   npx wrangler kv namespace create AUTH_KV
# Without this binding the worker still runs (login/commit/get/access
# work), but /invite, /accept-invite, and /share-link return 503.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "a8c164ca55b14dd08d786a98ced12176"

# Race data. Created with:
#   npx wrangler d1 create sendoff
#
# The id is an identifier, not a credential, so it belongs in git next to the
# KV namespace above. Nothing reads this binding yet; it is here so the schema
# can ship and be applied before any code depends on it.
[[d1_databases]]
binding = "DB"
database_name = "sendoff"
database_id = "e6086753-53c9-4db9-8571-2f8966804bc3"

# To put this worker behind api.sendoff.run, add a custom domain in the
# Cloudflare dashboard or uncomment + edit:
# [[routes]]
# pattern = "api.sendoff.run/*"
# zone_name = "sendoff.run"

# Photos, attached to a leg of the course. See migrations/0004_media.sql.
#
# Without this binding the worker still runs and every photo endpoint answers
# "not configured" rather than throwing: the rest of a race is unaffected by a
# bucket that does not exist yet. Create it with
#   npx wrangler r2 bucket create sendoff-media
#
# MEDIA_BASE_URL is the bucket's public hostname, and it is the difference
# between a photo costing a worker request and costing none. R2 bills no egress
# either way; what it saves is the 100,000 requests a day this account has for
# everything. Leave it empty and reads fall back through /media-file, which
# works and is the thing to move off. Set it in the dashboard once the bucket
# has a custom domain or an r2.dev address.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sendoff-media"
