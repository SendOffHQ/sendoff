# Deploys the auth proxy when its source changes on main.
#
# The credentials live here rather than in anyone's shell: this is the only
# place that holds a Cloudflare token, and it is a repository secret that
# nothing in a session can read back. A change to the worker ships by being
# merged, the same way a change to the site does.
name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  # Lets you redeploy the current main without pushing a commit.
  workflow_dispatch:

# Two merges in quick succession should not race each other onto the same
# worker. The later one wins; the earlier is cancelled before it deploys.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

# A build runner has nothing useful to report and no one to consent for it.
env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # The worker gates every write. A deploy that breaks it is worse than a
      # deploy that does not happen, so the suite runs before anything reaches
      # Cloudflare.
      - run: npm test

      # A missing secret otherwise surfaces as an opaque wrangler auth error.
      - name: Check credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      # Parses the worker and its config without touching the live one, so a
      # syntax error fails here rather than half way through a deploy.
      - name: Dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build

      # Schema before code, so a migration is never behind the worker that needs
      # it. Applied from here for the same reason the deploy is: this is the
      # only place that holds a Cloudflare token.
      #
      # This was allowed to fail while nothing read D1. It is not any more, and
      # the reason is what happened when it was: the token had no D1
      # permission, this step failed, the tick beside it stayed green, and two
      # deploys shipped code that queried tables which did not exist. A deploy
      # that skipped the schema is worse than one that did not happen.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply sendoff --remote || {
            echo "::warning::D1 migrations did not apply. If this is a permissions" \
                 "error, the API token needs D1 edit as well as Workers Scripts edit."
            exit 1
          }

      # The photo bucket. wrangler deploy refuses a binding whose bucket does
      # not exist, so this has to run first or the first deploy carrying
      # [[r2_buckets]] takes the whole worker down with it, including changes
      # that have nothing to do with photographs.
      #
      # Allowed to fail, unlike the migrations above, and the difference is
      # what happens next. A bucket that is already there fails this step and
      # is the normal case after the first run. A token with no R2 permission
      # also fails it, and then the deploy below fails too, loudly, naming the
      # binding. There is no version of this that ships code against a bucket
      # that is not there.
      - name: Ensure the photo bucket exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create sendoff-media || {
            echo "::notice::Could not create the R2 bucket. Normal once it exists." \
                 "If the deploy below fails naming the MEDIA binding, the API token" \
                 "needs R2 edit as well as Workers Scripts edit and D1 edit."
          }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
