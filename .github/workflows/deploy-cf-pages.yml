# Publishes the same site to Cloudflare Pages, alongside the GitHub Pages
# deploy rather than instead of it.
#
# Both run on every push to main during the trial. That is the point: the two
# hosts serve the same commit at the same time, so they can be compared, and
# reverting is a DNS change rather than a rebuild. See HOSTING.md.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN    scoped to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID
# Without them this job is skipped, so it is inert until they are set.
name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # What gets served, assembled explicitly rather than "the whole repo
      # minus the hidden bits". The three directories left out are not
      # referenced by any page: checked, not assumed.
      - name: Assemble the site
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'worker' \
            --exclude 'test' \
            --exclude 'tools' \
            --exclude 'dist'
          echo "files: $(find dist -type f | wc -l)"
          du -sh dist

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=sendoff --branch=main --commit-dirty=true
