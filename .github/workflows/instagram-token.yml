# Refreshes the Instagram token twice a month so it never reaches its 60-day
# end. A failed run here is GitHub's email telling you the token needs
# attention, before a post fails for it. See tools/instagram-token.mjs.
name: Refresh Instagram token

on:
  schedule:
    - cron: '23 14 1,15 * *'
  workflow_dispatch:

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: node tools/instagram-token.mjs
