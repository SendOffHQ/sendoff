<!-- SendOff wordmark — reference markup.
     Copy the .so-wordmark block into any page. Styles live in brand/tokens.css.

     Two things control it:
       .so-on-dark / .so-on-light / .so-on-beam  → which signal value is used
       --so-wm-size                              → everything scales off this

     The SVG strokes read var(--so-signal), so the mark recolours with the
     ground preset and never needs a second copy of the markup.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SendOff wordmark — reference</title>
<link rel="icon" href="sendoff-favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; font-family: var(--so-font-body); }
  .demo { padding: 48px 40px; display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .demo.dark  { background: var(--so-void); }
  .demo.light { background: var(--so-cream); }
  .label {
    font-family: var(--so-font-mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; opacity: 0.6;
  }
  .demo.dark .label  { color: var(--so-ink-on-dark); }
  .demo.light .label { color: var(--so-ink-on-light); }
</style>
</head>
<body>

<!-- ============ ON DARK ============ -->
<div class="demo dark so-on-dark">
  <span class="label">on dark · 96px</span>

  <div class="so-wordmark" style="--so-wm-size: 96px;">
    <span>Send</span>
    <svg class="so-o" viewBox="0 0 100 100" aria-label="SendOff">
      <ellipse cx="50" cy="50" rx="34" ry="42" fill="none"
               stroke="var(--so-signal)" stroke-width="16" transform="rotate(-13 50 50)"/>
      <ellipse cx="45" cy="43" rx="12" ry="14"
               fill="var(--so-signal)" transform="rotate(-13 45 43)"/>
    </svg>
    <span>ff</span>
    <span class="so-pulse" aria-hidden="true">
      <i class="so-bar"></i>
      <svg class="so-spike" viewBox="0 0 130 100" preserveAspectRatio="xMidYMid meet">
        <path d="M 0 50 L 14 50 L 22 38 L 30 48 L 40 30 L 48 44 L 58 8 L 64 94
                 L 72 34 L 82 46 L 92 32 L 100 46 L 110 50 L 130 50"
              fill="none" stroke="var(--so-signal)" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <i class="so-bar tail"></i>
    </span>
  </div>

  <div class="so-wordmark tight" style="--so-wm-size: 34px;">
    <span>Send</span>
    <svg class="so-o" viewBox="0 0 100 100" aria-label="SendOff">
      <ellipse cx="50" cy="50" rx="34" ry="42" fill="none"
               stroke="var(--so-signal)" stroke-width="16" transform="rotate(-13 50 50)"/>
      <ellipse cx="45" cy="43" rx="12" ry="14"
               fill="var(--so-signal)" transform="rotate(-13 45 43)"/>
    </svg>
    <span>ff</span>
    <span class="so-pulse" aria-hidden="true">
      <i class="so-bar"></i>
      <svg class="so-spike" viewBox="0 0 130 100" preserveAspectRatio="xMidYMid meet">
        <path d="M 0 50 L 14 50 L 22 38 L 30 48 L 40 30 L 48 44 L 58 8 L 64 94
                 L 72 34 L 82 46 L 92 32 L 100 46 L 110 50 L 130 50"
              fill="none" stroke="var(--so-signal)" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <i class="so-bar tail"></i>
    </span>
  </div>
</div>

<!-- ============ ON LIGHT ============ -->
<div class="demo light so-on-light">
  <span class="label">on light · 96px</span>

  <div class="so-wordmark" style="--so-wm-size: 96px;">
    <span>Send</span>
    <svg class="so-o" viewBox="0 0 100 100" aria-label="SendOff">
      <ellipse cx="50" cy="50" rx="34" ry="42" fill="none"
               stroke="var(--so-signal)" stroke-width="16" transform="rotate(-13 50 50)"/>
      <ellipse cx="45" cy="43" rx="12" ry="14"
               fill="var(--so-signal)" transform="rotate(-13 45 43)"/>
    </svg>
    <span>ff</span>
    <span class="so-pulse" aria-hidden="true">
      <i class="so-bar"></i>
      <svg class="so-spike" viewBox="0 0 130 100" preserveAspectRatio="xMidYMid meet">
        <path d="M 0 50 L 14 50 L 22 38 L 30 48 L 40 30 L 48 44 L 58 8 L 64 94
                 L 72 34 L 82 46 L 92 32 L 100 46 L 110 50 L 130 50"
              fill="none" stroke="var(--so-signal)" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <i class="so-bar tail"></i>
    </span>
  </div>
</div>

</body>
</html>
