<!-- Stories, 9:16, for events: one per section, posted from the phone so a
     link sticker can go on it (the publishing API cannot add one). Same
     tokens, fonts and wordmark as features.html; the screens are real
     screenshots from capture-race.mjs.

     Render with:
       SRC=$PWD/stories.html PREFIX=sendoff-story- SIZE=1080x1920 node shoot-features.js

     Instagram covers about the top 250px with the progress bar and the
     account name, and the bottom 300 with the reply bar, so nothing that has
     to be read goes there. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --void:#0A0F14; --panel:#121820; --line:#253340;
    --signal:#0FB8BF; --beam:#5EFDF6; --deep:#0A5F68; --deeper:#083F47;
    --ink:#F0ECE3; --mute:#7A8D99;
    --disp:'Barlow Condensed',sans-serif; --mono:'JetBrains Mono',monospace; --body:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--void); color:var(--ink); font-family:var(--body);
    padding:96px 88px; margin-bottom:24px;
  }
  /* The carousel's ground, unchanged. */
  .grad{background:linear-gradient(120deg, var(--deep) 0%, var(--void) 78%)}
  .glow::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 900px 620px at 18% 6%, rgba(15,184,191,.22), transparent 66%);
    pointer-events:none;
  }
  .wm svg{width:auto;display:block;--wm-signal:var(--signal);--wm-letter:var(--ink)}
  .slide .wm svg{height:64px}

  .top{position:relative;z-index:2}
  .kick{font-family:var(--mono);font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:var(--signal);margin-top:64px}
  h1{font-family:var(--disp);font-weight:800;font-size:100px;line-height:.94;letter-spacing:.005em;margin-top:18px}
  h1 em{font-style:normal;color:var(--signal)}
  p.lead{font-size:29px;line-height:1.45;color:var(--ink);opacity:.86;max-width:30ch;margin-top:26px}
  .chips{display:flex;flex-direction:column;gap:14px;margin-top:34px;align-items:flex-start}
  .chip{font-family:var(--mono);font-size:21px;color:var(--signal);border:1.5px solid rgba(15,184,191,.45);
         background:rgba(15,184,191,.08);border-radius:999px;padding:12px 22px}

  /* The phone runs off the bottom edge on the right, so the text column
     keeps the left and the screen still reads at grid size. */
  .phone{position:absolute;right:48px;top:450px;width:500px;padding:14px;border-radius:64px;
          background:#05080B;border:2px solid #2A3845;
          box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 10px rgba(15,184,191,.05), 0 0 90px rgba(15,184,191,.18);z-index:1}
  .phone img{display:block;width:100%;border-radius:50px}
  .phone::before{content:'';position:absolute;top:26px;left:50%;transform:translateX(-50%);
                  width:120px;height:32px;border-radius:20px;background:#05080B;z-index:2}

  .foot{position:absolute;left:88px;bottom:88px;font-family:var(--mono);font-size:21px;letter-spacing:.16em;
         text-transform:uppercase;color:var(--mute);z-index:2}

  /* A wide device under the text, for screens that do not fit a phone:
     the settings table and the printed report. */
  .wide .phone{display:none}
  .tablet{position:absolute;left:50%;transform:translateX(-50%);top:640px;width:800px;padding:16px;border-radius:40px;
          background:#05080B;border:2px solid #2A3845;z-index:1;
          box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 90px rgba(15,184,191,.18)}
  .tablet img{display:block;width:100%;border-radius:26px}
  .wide h1 br.n{display:none}
  .wide .foot{display:none}

  /* The share post: the race's own card as a phone shows a pasted link. */
  .thread{position:absolute;left:88px;right:88px;top:620px;display:flex;flex-direction:column;gap:18px;z-index:1}
  .bubble{align-self:flex-end;max-width:640px;border-radius:34px 34px 10px 34px;overflow:hidden;
          background:#1F2A35;box-shadow:0 30px 90px rgba(0,0,0,.5)}
  .bubble img{display:block;width:100%}
  .bubble .meta{padding:20px 28px 24px;font-size:26px;line-height:1.3}
  .bubble .meta b{display:block;font-weight:600}
  .bubble .meta span{color:var(--mute);font-family:var(--mono);font-size:21px}
  .reply{align-self:flex-start;background:#26323D;border-radius:34px 34px 34px 10px;padding:22px 30px;
         font-size:28px;max-width:560px}
  .reply.me{align-self:flex-end;background:var(--signal);color:#062226;border-radius:34px 34px 10px 34px}

  /* The disciplines post: the list itself is the picture. */
  .cloud{display:flex;flex-wrap:wrap;gap:16px;margin-top:56px;max-width:900px}
  .cloud .chip{font-size:30px;padding:16px 30px}
  .cloud .chip.hot{background:var(--signal);color:#062226;border-color:var(--signal)}

  /* A story is a slide stretched to 9:16, text centred over a centred phone. */
  .slide.story{width:1080px;height:1920px;padding:250px 88px 300px;text-align:center}
  .story .wm svg{height:56px;margin:0 auto}
  .story .kick{margin-top:48px}
  .story h1{font-size:118px}
  .story p.lead{margin:24px auto 0;max-width:30ch}
  .story .phone{left:50%;right:auto;transform:translateX(-50%);width:600px;top:990px}
  .story .when{margin-top:26px;font-family:var(--mono);font-size:24px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--signal)}
  /* A racer's portrait beside the phone: the phone moves left and the
     portrait, with the handle and the photo's credit, sits level with it. */
  .story.with-portrait .phone{left:88px;transform:none;width:560px}
  .portrait{position:absolute;right:88px;width:300px;z-index:2;text-align:center}
  .portrait img{display:block;width:300px;height:300px;border-radius:50%;object-fit:cover;
    border:6px solid var(--signal);box-shadow:0 0 0 10px rgba(15,184,191,.12), 0 0 80px rgba(15,184,191,.35), 0 30px 80px rgba(0,0,0,.55)}
  .portrait figcaption{margin-top:20px;font-family:var(--mono);font-size:26px;color:var(--ink);letter-spacing:.04em}
  .portrait figcaption small{display:block;margin-top:8px;font-size:16px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
</style></head><body>

<section class="slide story with-portrait grad glow" id="ghost-train">
  <div class="top">
    <div class="wm"></div>
    <p class="kick">This weekend · Brookline, NH</p>
    <h1>Follow Joe<br>on the <em>Ghost<br>Train.</em></h1>
    <p class="lead" style="max-width:40ch;text-wrap:balance">15-mile laps, a 10-mile one every seventh, so lap 7 lands on 100, repeated for 30 hours.<br>Every lap live on SendOff.</p>
    <p class="when">Sat 9 AM to Sun 3 PM ET · sendoff.run</p>
  </div>
  <!-- From the map down to the loop chips: the course heading above it sits
       under the phone's notch. -->
  <figure class="portrait" style="top:1110px"><img src="photos/joe-rucco-bust.jpg" alt=""><figcaption>@joe_rucco<small>Photo · Midstate Massive</small></figcaption></figure>
  <div class="phone"><img src="shots/ghost-train-map.png" alt="" style="object-fit:cover;object-position:50% 58%;aspect-ratio:1170/1255"></div>
</section>

 594 6 662.0 62" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 56.0 208 L 600.0 208" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><path d="M -20.0 870.0 L 1224.0 870.0 L 1304.0 818.8 L 1384.0 850.8 L 1474.0 742.0 L 1554.0 793.2 L 1664.0 550.0 L 1754.0 927.6 L 1844.0 729.2 L 1934.0 806.0 L 2024.0 774.0 L 2124.0 844.4 L 2224.0 870.0 L 3468.0 870.0" fill="none" stroke="var(--wm-signal, #0FB8BF)" stroke-width="62.7" stroke-linecap="round" stroke-linejoin="round" /></g></svg></template>
<script>
  // One copy of the wordmark, placed in every slide.
  const wm = document.getElementById('wm-src').content;
  document.querySelectorAll('.wm').forEach(el => el.appendChild(wm.cloneNode(true)));
</script>
</body></html>
