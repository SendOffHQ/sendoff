<!-- The feature posts, one slide per feature, 4:5 for Instagram.
     Same tokens, fonts and wordmark as ig.html and announce.html, so they sit
     in the grid beside the intro carousel as one set.

     The phone screens are real screenshots of the app, made by
     capture-race.mjs from a real race with the clock wound back to a moment
     during it. Nothing on a screen is drawn here.

     Render with: node shoot-features.js   (see README.md) -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --void:#0A0F14; --panel:#121820; --line:#253340;
    --signal:#0FB8BF; --beam:#5EFDF6; --deep:#0A5F68; --deeper:#083F47;
    --ink:#F0ECE3; --mute:#7A8D99;
    --disp:'Barlow Condensed',sans-serif; --mono:'JetBrains Mono',monospace; --body:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--void); color:var(--ink); font-family:var(--body);
    padding:96px 88px; margin-bottom:24px;
  }
  /* The carousel's ground, unchanged. */
  .grad{background:linear-gradient(120deg, var(--deep) 0%, var(--void) 78%)}
  .glow::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 900px 620px at 18% 6%, rgba(15,184,191,.22), transparent 66%);
    pointer-events:none;
  }
  .wm svg{width:auto;display:block;--wm-signal:var(--signal);--wm-letter:var(--ink)}
  .slide .wm svg{height:64px}

  .top{position:relative;z-index:2}
  .kick{font-family:var(--mono);font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:var(--signal);margin-top:64px}
  h1{font-family:var(--disp);font-weight:800;font-size:100px;line-height:.94;letter-spacing:.005em;margin-top:18px}
  h1 em{font-style:normal;color:var(--signal)}
  p.lead{font-size:29px;line-height:1.45;color:var(--ink);opacity:.86;max-width:30ch;margin-top:26px}
  .chips{display:flex;flex-direction:column;gap:14px;margin-top:34px;align-items:flex-start}
  .chip{font-family:var(--mono);font-size:21px;color:var(--signal);border:1.5px solid rgba(15,184,191,.45);
         background:rgba(15,184,191,.08);border-radius:999px;padding:12px 22px}

  /* The phone runs off the bottom edge on the right, so the text column
     keeps the left and the screen still reads at grid size. */
  .phone{position:absolute;right:48px;top:450px;width:500px;padding:14px;border-radius:64px;
          background:#05080B;border:2px solid #2A3845;
          box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 10px rgba(15,184,191,.05), 0 0 90px rgba(15,184,191,.18);z-index:1}
  .phone img{display:block;width:100%;border-radius:50px}
  .phone::before{content:'';position:absolute;top:26px;left:50%;transform:translateX(-50%);
                  width:120px;height:32px;border-radius:20px;background:#05080B;z-index:2}

  .foot{position:absolute;left:88px;bottom:88px;font-family:var(--mono);font-size:21px;letter-spacing:.16em;
         text-transform:uppercase;color:var(--mute);z-index:2}
</style></head><body>

<section class="slide grad glow" id="live-race">
  <div class="top">
    <div class="wm"><svg role="img" aria-label="SendOff" xmlns="http://www.w3.org/2000/svg" width="3059" height="1066" viewBox="-130 -130 3781.0 1317.6"><title>SendOff</title><g transform="translate(0,700) skewX(-16.0) translate(0,-700)"><g><g transform="translate(2006.0,0)"><circle cx="350.0" cy="350.0" r="294.0" fill="none" stroke="var(--wm-signal, #0FB8BF)" stroke-width="112" /></g></g><circle cx="2370.0" cy="350.0" r="80" fill="var(--wm-signal, #0FB8BF)" /><g transform="translate(0.0,0)"><path d="M 374.0 168 C 374.0 44 56.0 44 56.0 190 C 56.0 322 374.0 368 374.0 506 C 374.0 656 56.0 656 56.0 528" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><g transform="translate(446.0,0)"><path d="M 56.0 425.0 L 544.24 425.0" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 489.41 469.6 A 219.0 219.0 0 1 0 419.5 589.2" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><g transform="translate(1024.0,0)"><path d="M 56.0 700 L 56.0 150" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 56.0 340 C 56.0 158 444.0 158 444.0 340 L 444.0 700" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><g transform="translate(1552.0,0)"><circle cx="275.0" cy="425.0" r="219.0" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" /><path d="M 494.0 56.0 L 494.0 700" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><g transform="translate(2730.0,0)"><path d="M 152.0 700 L 152.0 150 C 152.0 34 264 6 332.0 62" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 482.0 700 L 482.0 150 C 482.0 34 594 6 662.0 62" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 56.0 208 L 600.0 208" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><path d="M -20.0 870.0 L 1224.0 870.0 L 1304.0 818.8 L 1384.0 850.8 L 1474.0 742.0 L 1554.0 793.2 L 1664.0 550.0 L 1754.0 927.6 L 1844.0 729.2 L 1934.0 806.0 L 2024.0 774.0 L 2124.0 844.4 L 2224.0 870.0 L 3468.0 870.0" fill="none" stroke="var(--wm-signal, #0FB8BF)" stroke-width="62.7" stroke-linecap="round" stroke-linejoin="round" /></g></svg></div>
    <p class="kick">Live race page</p>
    <h1>Where are<br>they now?<br><em>Right here.</em></h1>
    <p class="lead" style="max-width:21ch">Splits, pace against the cutoff and the projected finish, as it happens.</p>
    <div class="chips">
      <span class="chip">No refresh</span>
      <span class="chip">No account to watch</span>
      <span class="chip">Updates in seconds</span>
    </div>
  </div>
  <div class="phone"><img src="shots/live-race.png" alt=""></div>
  <div class="foot">sendoff.run</div>
</section>

</body></html>
