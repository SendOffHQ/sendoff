<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- This page answers to two addresses: race.html?id=<slug>, and
     /races/<slug>/ when the service worker serves it there with no signal.
     Every script, style and asset below is written relative, which is right
     at the root and resolves to /races/<slug>/lib/... at the other. One base
     tag keeps them all pointing at the same place from either address. -->
<base href="/">
<title>SendOff</title>
<link rel="icon" href="brand/sendoff-favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0f14" />
<meta name="description" content="Live splits, pace against cutoff, elevation and pit time, updated by the crew as the race runs.">
<link rel="canonical" href="https://sendoff.run/race.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SendOff">
<meta property="og:title" content="SendOff · Follow live">
<meta property="og:description" content="Live splits, pace against cutoff, elevation and pit time, updated by the crew as the race runs.">
<meta property="og:url" content="https://sendoff.run/race.html">
<meta property="og:image" content="https://sendoff.run/brand/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SendOff · live crew tracking for ultras">

<meta name="twitter:title" content="SendOff · Follow live">
<meta name="twitter:description" content="Live splits, pace against cutoff, elevation and pit time, updated by the crew as the race runs.">
<meta name="twitter:image" content="https://sendoff.run/brand/og-default.png">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SendOff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/race-theme.css?v=29">
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css" />
<style>
  .cutoffs {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; padding: 18px 24px; margin-bottom: 32px;
    display: grid; grid-template-columns: auto 1fr auto auto auto;
    gap: 32px; align-items: center;
  }
  @media (max-width: 800px) { .cutoffs { grid-template-columns: 1fr 1fr; gap: 16px; } }
  .cutoffs-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .cutoff-item { display: flex; flex-direction: column; gap: 2px; }
  .cutoff-item .v { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .cutoff-item .l { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .cutoff-item.warn .v { color: var(--yellow); }
  .cutoff-item.danger .v { color: var(--red); }

  .race-clock { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  /* Below this the header wraps and the clock drops under the brand, where
     right-aligning it just floats the short label out over the middle of the
     timer. Measured: it stops sitting beside the brand at about 800px. */
  @media (max-width: 800px) {
    .race-clock { text-align: left; align-items: flex-start; }
  }
  .race-clock .label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .race-clock .time {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em;
  }

  .runners { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 1100px) { .runners { grid-template-columns: 1fr; } }
  .runners.single { grid-template-columns: 1fr; max-width: 900px; margin: 0 auto; }

  .runner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; position: relative;
  }
  .runner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--runner-color, var(--accent)), transparent);
  }
  /* The preview has to hold a 4:5 and a 16:9 without the modal jumping, so the
     stage is a fixed band and the canvas fits inside it. */
  .fc-stage {
    display: flex; align-items: center; justify-content: center;
    height: 340px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px;
  }
  .fc-stage canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

  .fc-ratios { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .fc-ratio {
    background: var(--bg-elevated); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; padding: 7px 13px; cursor: pointer; min-height: 32px;
  }
  .fc-ratio:hover { color: var(--text); border-color: var(--border-bright); }
  .fc-ratio[aria-pressed="true"] {
    background: rgba(15,184,191,0.14); color: var(--accent); border-color: var(--accent);
  }
  .fc-ratio:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The finish card's switches. A grid rather than a list, because there are
     ten of them and they are all one word. */
  .fc-parts {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 6px 12px; margin: 14px 0 4px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .fc-parts-title {
    grid-column: 1 / -1; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 2px;
  }
  .fc-part {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px;
    color: var(--text-dim); cursor: pointer; min-height: 26px;
  }
  .fc-part input { accent-color: var(--accent); margin: 0; }
  .fc-part:hover { color: var(--text); }

  .runner-head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .finish-card-btn {
    background: rgba(15,184,191,0.12); color: var(--accent);
    border: 1px solid rgba(15,184,191,0.45); border-radius: 3px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 11px; cursor: pointer;
  }
  .finish-card-btn:hover { background: rgba(15,184,191,0.22); border-color: var(--accent); }
  .finish-card-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .runner-head {
    padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  }
  .runner-name {
    font-family: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif; font-size: 32px;
    font-weight: 600; letter-spacing: -0.02em;
  }
  .runner-bib {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-top: 4px;
  }
  .status-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px; border: 1px solid currentColor;
  }
  .status-onpace { color: var(--green); }
  .status-tight { color: var(--yellow); }
  .status-offpace { color: var(--red); }
  .status-notstarted { color: var(--text-muted); }
  .status-finished { color: var(--accent); }

  /* Four across at every size above phones. The runner card is capped at
     900px, so a nine-column row gave each tile about 100px of content
     against the 127px the longest label needs, and "Course Total" wrapped
     while its neighbours did not, dropping that tile's figure out of line
     with the rest. Four columns leave 197px. */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 16px 14px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .stat:last-child { border-right: none; }
  .stat:nth-child(4n) { border-right: none; }
  .stat:nth-last-child(-n+4) { border-bottom: none; }
  .stat.live .value, .stat.live-course .value { color: var(--accent); }
  .stat.live-pit .value { color: var(--green); }
  .stat.live-course .label, .stat.live-pit .label {
    animation: liveBlink 2s ease-in-out infinite;
  }
  @keyframes liveBlink {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .stat .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted);
  }
  .stat .value {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--text);
  }
  .stat .sub { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2n) { border-right: none; }
    .stat:nth-last-child(-n+2) { border-bottom: none; }
    .stat { padding: 14px 12px; }
  }

  .intake { padding: 20px 28px 24px; border-bottom: 1px solid var(--border); }
  /* Flex, not inline text. A band label like "dark, cold (~35-45F), pre-dawn"
     wraps on a phone, and an inline span with a border wrapped mid-word draws
     half a box around the end of the title and half around the rest. Laid out
     as two items, the tag stays one box and wraps inside itself. */
  .intake-title {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 14px;
  }
  .intake-band {
    color: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
    padding: 2px 6px; letter-spacing: 0.12em; min-width: 0; overflow-wrap: anywhere;
  }
  .intake-now { color: var(--text-muted); font-size: 10px; margin-left: 4px; }
  .intake-row {
    display: grid; grid-template-columns: 90px 1fr auto auto;
    gap: 14px; align-items: center; padding: 8px 0;
  }
  .intake-row .name { font-size: 13px; color: var(--text-dim); }
  .bar-track {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; position: relative;
  }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .bar-fill.good { background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.low { background: var(--red); }
  .intake-row .num {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 600; text-align: right; min-width: 90px;
  }
  .intake-row .target {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); min-width: 60px; text-align: right;
  }

  .legs-section { padding: 20px 28px 28px; }
  .legs-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
  }
  .legs-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }

  /* Loops grid (Bloodroot style) */
  .legs-grid {
    display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 6px; margin-bottom: 16px;
  }
  @media (max-width: 600px) { .legs-grid { grid-template-columns: repeat(5, 1fr); } }
  .leg-cell {
    aspect-ratio: 1; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 3px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'JetBrains Mono', monospace;
  }
  .leg-cell .n { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .leg-cell .t { font-size: 11px; font-weight: 700; }
  .leg-cell.done { background: rgba(110, 231, 168, 0.08); border-color: rgba(110, 231, 168, 0.4); }
  .leg-cell.done .t { color: var(--green); }
  .leg-cell.slow { background: rgba(255, 176, 122, 0.08); border-color: rgba(255, 176, 122, 0.4); }
  .leg-cell.slow .t { color: var(--yellow); }
  .leg-cell.danger { background: rgba(229, 72, 77, 0.08); border-color: rgba(229, 72, 77, 0.4); }
  .leg-cell.danger .t { color: var(--red); }
  .leg-cell.current { background: var(--accent-glow); border-color: var(--accent); }
  .leg-cell.current .t { color: var(--accent); }

  /* Segments timeline (Sangre-style) */
  .seg-list { display: flex; flex-direction: column; }
  .seg-row {
    display: grid; grid-template-columns: 32px 1fr 80px 80px 80px;
    gap: 10px; padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    align-items: center; font-size: 12px;
  }
  @media (max-width: 700px) {
    .seg-row { grid-template-columns: 28px 1fr 60px; }
    .seg-row .col-cut, .seg-row .col-pit { display: none; }
  }
  .seg-row:last-child { border-bottom: none; }
  .seg-row .num { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 700; }
  .seg-row .nm { color: var(--text); }
  .seg-row .nm .meta { color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .seg-row .col-dur, .seg-row .col-cut, .seg-row .col-pit {
    font-family: 'JetBrains Mono', monospace; text-align: right;
  }
  .seg-row .col-dur { color: var(--text); }
  .seg-row .col-cut { color: var(--text-muted); font-size: 11px; }
  .seg-row .col-pit { color: var(--text-dim); font-size: 11px; }
  .seg-row.done { background: rgba(110, 231, 168, 0.05); }
  .seg-row.done .col-dur { color: var(--green); }
  .seg-row.current { background: var(--accent-glow); }
  .seg-row.current .col-dur { color: var(--accent); }
  .seg-row.current .col-dur::after { content: ' ●'; }
  .seg-row.danger .col-dur { color: var(--red); }

  /* Leg log */
  .leglog { border-top: 1px solid var(--border); margin-top: 8px; }
  .leglog-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 6px;
    cursor: pointer; user-select: none;
  }
  .leglog-head:hover .leglog-toggle { color: var(--accent); border-color: var(--accent); }
  .leglog-head-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
  .leglog-toggle {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    border: 1px solid var(--border-bright); border-radius: 3px; padding: 4px 9px;
  }
  .leglog-toggle::before { content: '▼ '; }
  .leglog.collapsed .leglog-toggle::before { content: '▶ '; }
  .leglog.collapsed tr.leg-old, .leglog.collapsed tr.note-old { display: none; }
  .leglog.collapsed .when-expanded, .leglog:not(.collapsed) .when-collapsed { display: none; }
  .leglog table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .leglog th {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    text-align: left; padding: 14px 8px 10px; font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .leglog th:first-child { padding-left: 0; }
  .leglog th.num, .leglog td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .leglog td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .leglog td:first-child { padding-left: 0; }
  .leglog tr:last-child td { border-bottom: none; }
  .leglog .leg-num {
    font-family: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 600;
    color: var(--accent); width: 28%; min-width: 30px;
  }
  .leglog tr.leg-row:has(+ tr.note-row) td { border-bottom: none; padding-bottom: 6px; }
  .leglog tr.note-row td {
    padding: 0 8px 12px 8px; padding-left: 38px;
    font-size: 11px; color: var(--text-dim); line-height: 1.5;
    border-bottom: 1px solid var(--border);
  }
  .leglog tr.note-row:last-child td { border-bottom: none; }
  .leglog tr.empty td { color: var(--text-muted); font-style: italic; text-align: center; padding: 24px; }
  .leglog .leg-seg { color: var(--text-muted); font-size: 10px; display: block; }
  .st-tag {
    display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid currentColor;
    vertical-align: 1px; white-space: nowrap;
  }
  .st-tag.cp     { color: var(--blue); }
  .st-tag.nocrew { color: var(--red); }
  .st-tag.bag    { color: var(--accent); }
  .st-tag.pacer  { color: var(--green); }
  .st-tag.note   { color: var(--yellow); text-transform: none; letter-spacing: 0.04em; }

  /* On a phone the columns do not fit: the segment name wraps to four lines
     and the last fuel metric falls off the right edge, and a race is free to
     track four or five of them. Each leg becomes a block instead, with the
     column names moving onto the values they label, and the cells auto-fit so
     the count of metrics decides how many rows it takes. Reads without
     sideways scrolling, which nobody does at an aid station. */
  @media (max-width: 560px) {
    .leglog thead { display: none; }
    .leglog table, .leglog tbody { display: block; width: 100%; }
    .leglog tr.leg-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .leglog tr.leg-row td { display: block; padding: 0; border-bottom: none; }
    .leglog tr.leg-row td.leg-num {
      grid-column: 1 / -1; width: auto;
      display: flex; align-items: baseline; gap: 8px;
    }
    .leglog .leg-seg { display: inline; font-size: 11px; min-width: 0; }
    .leglog tr.leg-row td.num { text-align: left; }
    .leglog tr.leg-row td.num::before {
      content: attr(data-label);
      display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 3px;
    }
    .leglog tr.note-row { display: block; }
    .leglog tr.note-row td { display: block; padding: 0 0 12px; }
    .leglog tr.empty { display: block; }
  }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .share-banner {
    background: var(--bg-card); border: 1px solid var(--blue);
    color: var(--text); padding: 10px 16px; border-radius: 4px;
    margin: 0 0 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .share-banner .em { color: var(--blue); }

  /* Course map */
  #course-map-section { margin-bottom: 24px; }
  .course-map-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 10px;
  }
  .course-map-title {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .course-map-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim);
  }
  #course-map {
    height: 380px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-card);
  }
  #course-map .leaflet-control-attribution {
    background: rgba(10, 15, 20, 0.8); color: var(--text-muted);
  }
  #course-map .leaflet-control-attribution a { color: var(--text-dim); }
  .aid-marker-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
  }
  .course-elev {
    width: 100%; height: auto; display: block; margin-top: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .course-elev .elev-area { fill: rgba(15, 184, 191, 0.16); stroke: none; }
  .course-elev .elev-line { fill: none; stroke: #0fb8bf; stroke-width: 1.6; }
  .course-elev .elev-aid-line { stroke-dasharray: 3 3; }
  .course-elev .elev-grid { stroke: var(--border); stroke-width: 1; }
  .course-elev .elev-axis-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    fill: var(--text-muted);
  }
  .course-elev .elev-axis-unit {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    fill: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .course-elev .elev-aid-dot { cursor: pointer; }
  .course-elev .elev-popup-bg { fill: rgba(10, 15, 20, 0.94); stroke: var(--border-bright); }
  .course-elev .elev-popup-text {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text);
  }
  .course-elev .elev-runner-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  }
  /* Predicted runner position dots (map + elevation profile) */
  .runner-dot { animation: runnerPulse 2s ease-in-out infinite; }
  @keyframes runnerPulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.35; }
  }
  .leaflet-tooltip.runner-dot-label {
    background: rgba(10, 15, 20, 0.85); border: none; box-shadow: none;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px;
  }
  .leaflet-tooltip.runner-dot-label::before { display: none; }
</style>
</head>

troke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 56.0 208 L 600.0 208" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><path d="M -20.0 870.0 L 1224.0 870.0 L 1304.0 818.8 L 1384.0 850.8 L 1474.0 742.0 L 1554.0 793.2 L 1664.0 550.0 L 1754.0 927.6 L 1844.0 729.2 L 1934.0 806.0 L 2024.0 774.0 L 2124.0 844.4 L 2224.0 870.0 L 3468.0 870.0" fill="none" stroke="var(--wm-signal, #0FB8BF)" stroke-width="62.7" stroke-linecap="round" stroke-linejoin="round" /></g></svg></a><span>·</span>

<footer class="site">

    <span class="legend-item"><span class="swatch" style="background: var(--yellow);"></span>Tight</span>
    <span class="legend-item"><span class="swatch" style="background: var(--red);"></span>Off pace</span>
    <span class="legend-item"><span class="swatch" style="background: var(--accent);"></span>Live</span>
  </div>

<!-- Served from here rather than a CDN so the route line, the aid dots and the
     predicted position still draw with no signal. The tiles underneath are
     Esri's and will be missing offline; the map is useful without them. -->
<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script src="lib/finish-card.js?v=8"></script>
<script src="lib/race-core.js?v=85"></script>
<script>
  const slug = Race.qs('id');

  // What somebody copies out of the address bar should be the address worth
  // sharing. Arriving at /races/<slug>/ forwards here, which put the app URL
  // back in the bar and undid the whole point of that page existing; most
  // people share by copying the bar rather than by finding a share panel.
  //
  // Only for a public race, because only a public race has a page. Only when
  // there is no token in the query, because a share link's token is the one
  // thing that must survive a copy. And guarded, because a browser that
  // dislikes this should not take the race page down with it.
  function useShareableAddress(cfg) {
    try {
      if (!cfg || cfg.visibility !== 'public') return;
      if (Race.qs('t') || Race.qs('new')) return;
      const want = new URL(Race.raceHref(slug, true), location.origin).pathname;
      if (location.pathname === want) return;
      history.replaceState(history.state, '', want + location.hash);
    } catch (e) { /* the address bar is cosmetic; the page is not */ }
  }
  if (!slug) { window.location = '/app/'; }

  // Update nav links to carry the slug

  let cfg = null, data = null;
  // How stale the race's own settings are allowed to get. See load().
  const CFG_MAX_AGE_MS = 60000;
  let cfgFetchedAt = 0;
  let lastFetchAt = null;
  const LEGLOG_KEY = `race-${slug}-leglog-collapsed-v1`;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function intakeClass(actual, target) {
    if (target === 0) return 'good';
    const ratio = actual / target;
    if (ratio >= 0.85) return 'good';
    if (ratio >= 0.65) return 'warn';
    return 'low';
  }

  function statusLabel(s) {
    return { onpace: 'On Pace', tight: 'Tight', offpace: 'Off Pace', notstarted: 'Not Started', finished: 'Finished' }[s] || s;
  }

  // A loop with no aid stations: rendered as the lap grid rather than rows.
  function isSimpleLoop() {
    return cfg && cfg.courseType === 'loops' && !((cfg.course && cfg.course.loopSegments) || []).length;
  }

  function loopCellClass(durationSec, status) {
    if (durationSec == null) return '';
    if (status === 'onpace' || status === 'finished') return 'done';
    // Without per-loop reference, fall back to runner overall status.
    if (status === 'tight') return 'slow';
    if (status === 'offpace') return 'danger';
    return 'done';
  }

  function renderCutoffs() {
    const start = new Date(cfg.startTime);
    const cuts = cfg.cutoffs || {};
    const final = new Date(start.getTime() + (cuts.totalHours || 0) * 3600 * 1000);
    const day = d => d.toDateString() === start.toDateString() ? '' : ' D2';
    const fmt = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + day(d);
    const tightHtml = cuts.lastLegStartHours
      ? `<div class="cutoff-item warn"><span class="v">${fmt(new Date(start.getTime() + cuts.lastLegStartHours * 3600 * 1000))}</span><span class="l">Last leg start · ${cuts.lastLegStartHours}h</span></div>`
      : '';
    document.getElementById('cutoffs').style.display = '';
    document.getElementById('cutoffs').innerHTML = `
      <span class="cutoffs-label">Cutoffs</span>
      <div></div>
      <div class="cutoff-item"><span class="v">${fmt(start)}</span><span class="l">Start</span></div>
      ${tightHtml}
      <div class="cutoff-item danger"><span class="v">${fmt(final)}</span><span class="l">Final · ${cuts.totalHours}h</span></div>
    `;
  }

  function loopLegCells(runner, c) {
    const totalLoops = cfg.course?.loopCount || 0;
    return Array.from({ length: totalLoops }, (_, i) => {
      const idx1 = i + 1;
      const dur = c.legDurations[i];
      const isCurrent = idx1 === c.legsDone + 1 && c.status !== 'notstarted' && c.legsDone < totalLoops;
      let cls = '';
      if (dur != null) cls = loopCellClass(dur, c.status);
      if (isCurrent) cls = 'current';
      const text = dur != null
        ? Race.fmt.durationShort(dur)
        : (isCurrent ? '···' : '–');
      return `<div class="leg-cell ${cls}"><span class="n">L${idx1}</span><span class="t">${text}</span></div>`;
    }).join('');
  }

  // What waits at the end of a leg: a timing point with no aid, a stop the crew
  // cannot drive to, the lot they park in. A crew needs this while planning the
  // day, not only in the log after the leg is already run.
  function stationTags(st) {
    if (!st) return '';
    const tags = [];
    if (st.checkpoint) tags.push(['cp', 'Checkpoint']);
    else if (!st.crewAccess) tags.push(['nocrew', 'No crew']);
    if (st.dropBag) tags.push(['bag', 'Drop bag']);
    if (st.pacerEligible) tags.push(['pacer', 'Pacer']);
    if (st.crewNote) tags.push(['note', st.crewNote]);
    return tags.length
      ? ' ' + tags.map(([c, t]) => `<span class="st-tag ${c}">${escapeHtml(t)}</span>`).join('')
      : '';
  }

  function segmentRows(runner, c) {
    const segs = Race.course.legs(cfg);
    // The start is not a leg, so it has no row of its own, but a bag left there
    // or a lot the crew parks in is worth saying before the race begins.
    const st = Race.course.startAidTags(cfg);
    const startRow = !st ? '' : `
        <div class="seg-row start">
          <span class="num">–</span>
          <span class="nm">
            ${escapeHtml(Race.course.aidStations(cfg)[0]?.name || 'Start')}${stationTags(st)}
            <div class="meta">Before the start</div>
          </span>
          <span class="col-dur"></span><span class="col-cut"></span><span class="col-pit"></span>
        </div>`;
    return startRow + segs.map((s, i) => {
      const entry = (runner.legs || []).find(l => l.index === s.index);
      const dur = entry && entry.startTime && entry.endTime
        ? (new Date(entry.endTime) - new Date(entry.startTime)) / 1000 : null;
      const isCurrent = entry && entry.startTime && !entry.endTime;
      const isDone = dur != null;
      let cls = '';
      if (isDone) cls = 'done';
      if (isCurrent) cls = 'current';
      const cutoffText = s.arriveCutoffHours != null
        ? Race.fmt.hoursToHm(s.arriveCutoffHours) : '–';
      // Pit time after this segment: a finished gap, or the live pit if the
      // runner is in the pit after this leg right now.
      const nextEntry = (runner.legs || []).find(l => l.index === s.index + 1);
      const pitDone = entry && entry.endTime && nextEntry && nextEntry.startTime
        ? (new Date(nextEntry.startTime) - new Date(entry.endTime)) / 1000 : null;
      const pitLive = entry && entry.endTime && c.inPit && c.liveLegIndex === s.index;

      // Current-leg duration ticks every second via the .live-timer class.
      const durCell = isCurrent
        ? `<span class="col-dur live-timer" data-base="0" data-since="${entry.startTime}" data-fmt="short">${Race.fmt.durationShort(c.currentLegSeconds)}</span>`
        : `<span class="col-dur">${isDone ? Race.fmt.durationShort(dur) : '–'}</span>`;

      let pitCell = '<span class="col-pit"></span>';
      if (pitLive) {
        pitCell = `<span class="col-pit"><span class="live-timer" data-base="0" data-since="${entry.endTime}" data-fmt="short">${Race.fmt.durationShort(c.currentPitSeconds)}</span> pit</span>`;
      } else if (pitDone != null) {
        pitCell = `<span class="col-pit">${Race.fmt.durationShort(pitDone)} pit</span>`;
      }

      return `
        <div class="seg-row ${cls}">
          <span class="num">${s.index}</span>
          <span class="nm">
            ${escapeHtml(s.name)}${stationTags(Race.stationAt(cfg, s.index))}
            <div class="meta">${Race.units.distance(s.distanceMi, cfg)} · ${Race.units.distance(s.cumulativeMi, cfg)} total${s.elevationGainFt != null ? ` · +${Math.round(Race.units.elevationVal(s.elevationGainFt, cfg))}/-${Math.round(Race.units.elevationVal(Math.abs(s.elevationLossFt || 0), cfg))} ${Race.units.elevationLabel(cfg)}` : ''}</div>
          </span>
          ${durCell}
          <span class="col-cut">${cutoffText}</span>
          ${pitCell}
        </div>`;
    }).join('');
  }

  // The leg log is four fixed columns (#, Done, Leg, Pit) plus one per tracked
  // fuel metric, so both live here rather than as a hardcoded 7 in three places.
  function fuelMetrics() { return Race.fuel.metrics(cfg); }
  function logCols() { return 4 + fuelMetrics().length; }

  function legLog(runner, c) {
    if (!runner.legs || runner.legs.length === 0) {
      return `<tr class="empty"><td colspan="${logCols()}">Awaiting first leg</td></tr>`;
    }
    return runner.legs.slice().sort((a, b) => a.index - b.index).map((l, i, arr) => {
      const segDef = Race.course.legAt(cfg, l.index);
      const dur = (l.startTime && l.endTime)
        ? (new Date(l.endTime) - new Date(l.startTime)) / 1000 : null;
      const next = arr[i + 1];
      let pitSec = null;
      if (l.endTime && next && next.startTime) {
        pitSec = (new Date(next.startTime) - new Date(l.endTime)) / 1000;
      } else if (l.endTime && !next && c.inPit && i === arr.length - 1) {
        pitSec = c.currentPitSeconds;
      }
      const pitCell = pitSec != null
        ? Race.fmt.durationShort(pitSec) + (next ? '' : ' <span style="color: var(--accent); font-size: 9px;">●</span>')
        : '–';
      const noteParts = [l.gearChanges, l.meds, l.issues, l.notes].filter(Boolean);
      const isOld = (arr.length - 1 - i) >= 2;
      const oldCls = isOld ? ' leg-old' : '';
      const noteOldCls = isOld ? ' note-old' : '';
      const noteRow = noteParts.length
        ? `<tr class="note-row${noteOldCls}"><td colspan="${logCols()}">${escapeHtml(noteParts.join(' · '))}</td></tr>`
        : '';
      // Show the leg name for segments and loops-with-aids; a simple
      // lap-only loop just shows the index.
      const showName = segDef && segDef.name && !isSimpleLoop();
      const st = Race.stationAt(cfg, l.index);
      const tagHtml = stationTags(st);
      const legLabel = showName
        ? `${l.index} <span class="leg-seg">${escapeHtml(segDef.name)}${tagHtml}</span>`
        : `${l.index}${tagHtml}`;
      return `
        <tr class="leg-row${oldCls}">
          <td class="leg-num">${legLabel}</td>
          <td class="num" data-label="Done">${Race.fmt.clockTime(l.endTime)}</td>
          <td class="num" data-label="Leg">${dur ? Race.fmt.durationShort(dur) : '–'}</td>
          <td class="num" data-label="Pit">${pitCell}</td>
          ${fuelMetrics().map(m => `<td class="num" data-label="${escapeHtml(m.short)}">${
            l[m.key] != null && l[m.key] !== '' ? Race.fuel.fmt(m, l[m.key]) : '–'}</td>`).join('')}
        </tr>
        ${noteRow}`;
    }).join('');
  }

  function loadLeglogState() {
    try { return JSON.parse(localStorage.getItem(LEGLOG_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveLeglogState(s) { try { localStorage.setItem(LEGLOG_KEY, JSON.stringify(s)); } catch (e) {} }
  function leglogCollapsed(runnerId, count) {
    if (count <= 2) return false;
    const s = loadLeglogState();
    return s[runnerId] !== false;
  }

  function renderRunner(runner) {
    const c = Race.compute.runner(runner, cfg);
    const color = runner.color || 'var(--accent)';
    const totalDist = c.courseDist;
    const totalCutSec = (cfg.cutoffs?.totalHours || 0) * 3600;

    // A loop with aid stations expands into per-segment legs, so it renders
    // like a segments course (each row already names its lap). Only a simple
    // lap-only loop uses the lap grid.
    const legsBlock = isSimpleLoop()
      ? `<div class="legs-grid">${loopLegCells(runner, c)}</div>`
      : `<div class="seg-list">${segmentRows(runner, c)}</div>`;

    const legUnit = isSimpleLoop() ? 'Laps' : (cfg.courseType === 'segments' ? 'Segments' : 'Legs');

    return `
      <article class="runner" style="--runner-color: ${color};">
        <div class="runner-head">
          <div>
            <div class="runner-name">${escapeHtml(runner.name)}</div>
            <div class="runner-bib">${escapeHtml(runner.bib || '')}</div>
          </div>
          <div class="runner-head-right">
            ${c.status === 'finished'
              ? `<button class="finish-card-btn" type="button" data-card="${escapeHtml(runner.id)}">Finish card</button>` : ''}
            <span class="status-badge status-${c.status}">${statusLabel(c.status)}</span>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">${legUnit}</span>
            <span class="value">${c.legsDone}<span style="color: var(--text-muted); font-size: 14px;">/${c.totalLegs}</span></span>
            <span class="sub">${Race.units.distanceVal(c.milesDone, cfg).toFixed(1)} / ${Race.units.distance(totalDist, cfg)}</span>
          </div>
          <div class="stat">
            <span class="label">Race Time</span>
            <span class="value live-timer" data-base="${c.completedRaceSec}" data-since="${c.liveSince || ''}">${Race.fmt.duration(c.raceSec)}</span>
            <span class="sub">of ${Race.fmt.hoursToHm(cfg.cutoffs?.totalHours)}</span>
          </div>
          <div class="stat${c.inProgressLeg ? ' live' : ''}">
            <span class="label">Course Total</span>
            <span class="value live-timer" data-base="${c.completedCourseSec}" data-since="${c.inProgressLeg ? (c.liveSince || '') : ''}">${Race.fmt.duration(c.totalCourseSec)}</span>
            <span class="sub">${c.inProgressLeg ? 'on course' : 'running total'}</span>
          </div>
          <div class="stat${c.inPit ? ' live' : ''}">
            <span class="label">Pit Total</span>
            <span class="value live-timer" data-base="${c.completedPitSec}" data-since="${c.inPit ? (c.liveSince || '') : ''}">${Race.fmt.duration(c.totalPitSec)}</span>
            <span class="sub">${c.inPit ? 'in pit now' : (c.avgPitSec != null ? 'avg ' + Race.fmt.duration(c.avgPitSec) : 'no pit yet')}</span>
          </div>
          <div class="stat">
            <span class="label">Elevation</span>
            <span class="value">${c.elevGainFt != null ? '+' + Math.round(Race.units.elevationVal(c.elevGainFt, cfg)).toLocaleString() : '–'}</span>
            <span class="sub">${c.elevGainFt != null ? '−' + Math.round(Race.units.elevationVal(c.elevLossFt || 0, cfg)).toLocaleString() + ' ' + Race.units.elevationLabel(cfg) + ' · est.' : 'no profile'}</span>
          </div>
          ${(() => {
            let liveCls = '', liveValue = '–', liveSub;
            if (c.inProgressLeg) {
              liveCls = ' live-course';
              liveValue = Race.fmt.duration(c.currentLegSeconds);
              const segDef = Race.course.legAt(cfg, c.liveLegIndex);
              liveSub = cfg.courseType === 'segments'
                ? `${segDef ? segDef.name : 'Leg ' + c.liveLegIndex}`
                : `Lap ${c.liveLegIndex} on course`;
            } else if (c.inPit) {
              liveCls = ' live-pit';
              liveValue = Race.fmt.duration(c.currentPitSeconds);
              const segDef = Race.course.legAt(cfg, c.liveLegIndex);
              liveSub = cfg.courseType === 'segments'
                ? `at ${segDef && segDef.toAid ? segDef.toAid : 'aid'}`
                : `In pit · after lap ${c.liveLegIndex}`;
            } else if (c.legsDone >= c.totalLegs && c.legsDone > 0) {
              liveSub = 'finished';
            } else {
              liveSub = c.legsDone === 0 ? 'not started' : 'idle';
            }
            return `
              <div class="stat${liveCls}">
                <span class="label">Live</span>
                <span class="value live-timer" data-base="0" data-since="${c.liveSince || ''}">${liveValue}</span>
                <span class="sub">${liveSub}</span>
              </div>`;
          })()}
          <div class="stat">
            <span class="label">Pace</span>
            <span class="value">${Race.units.pace(c.paceSecPerMile, cfg)}</span>
            <span class="sub">${Race.units.paceLabel(cfg)}</span>
          </div>
          <div class="stat">
            <span class="label">Avg Leg</span>
            <span class="value">${Race.fmt.duration(c.avgLegSec)}</span>
            <span class="sub">last: ${Race.fmt.duration(c.lastLegSec)}</span>
          </div>
          <div class="stat">
            <span class="label">Projected</span>
            <span class="value">${Race.fmt.duration(c.projectedFinishSec)}</span>
            <span class="sub">${c.projectedFinishSec && totalCutSec ? (c.projectedFinishSec > totalCutSec ? 'over cutoff' : 'under cutoff') : '–'}</span>
          </div>
        </div>

        ${(() => {
          // Bands are named in race hours, because "after hour six" is how a
          // person says it. The rate they are compared against is intake over
          // moving time, which is how this page has always computed it; the two
          // clocks differ by aid station time, and they differed by exactly as
          // much when the goal was a single flat number.
          const raceHours = (c.completedRaceSec || 0) / 3600;
          // This runner's goals and bands, not the race's: two people on the
          // same course are held to their own plan.
          const plan = Race.fuel.forRunner(cfg, runner);
          const metrics = Race.fuel.metrics(plan, raceHours);
          const goals = metrics.filter(m => m.expectedPerHour);
          if (!goals.length) return '';
          const band = Race.fuel.bandAt(plan, raceHours);
          const banded = Race.fuel.bands(plan).length > 0;
          return `
        <div class="intake">
          <div class="intake-title">Intake / Hour${banded && band
            ? ` <span class="intake-band">${escapeHtml(band.label || `from hour ${band.fromHour}`)}</span>` : ''}</div>
          ${goals.map(m => {
            const per = c.intake[m.key]?.perHour || 0;
            // Against the average they should be at by now, not against the
            // rate in force this minute: a cumulative number held against an
            // instantaneous goal would call a runner behind for the whole
            // stretch after a goal steps down, when they are exactly on plan.
            const goal = m.expectedPerHour;
            const stepped = banded && m.targetNow != null && Math.abs(m.targetNow - goal) > 0.5;
            return `
            <div class="intake-row">
              <span class="name">${escapeHtml(m.label)}</span>
              <div class="bar-track"><div class="bar-fill ${intakeClass(per, goal)}" style="width: ${Math.min(100, (per / goal) * 100)}%"></div></div>
              <span class="num">${Race.fuel.fmt(m, per)}</span>
              <span class="target">/ ${Race.fuel.fmt(m, goal)}${stepped
                ? ` <span class="intake-now">now ${Race.fuel.fmt(m, m.targetNow)}</span>` : ''}</span>
            </div>`;
          }).join('')}
        </div>`;
        })()}

        <div class="legs-section">
          <div class="legs-head">
            <span class="legs-title">${cfg.courseType === 'loops' ? 'Lap Status' : 'Segments'}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);">
              ${c.legsDone} done · ${c.totalLegs - c.legsDone} to go
            </span>
          </div>
          ${legsBlock}
          <div class="leglog ${leglogCollapsed(runner.id, (runner.legs || []).length) ? 'collapsed' : ''}" data-runner="${runner.id}">
            ${(runner.legs || []).length > 2 ? `
              <div class="leglog-head" data-action="toggle-leglog" data-runner="${runner.id}">
                <span class="leglog-head-title">Leg Log</span>
                <span class="leglog-toggle">
                  <span class="when-collapsed">Show all ${runner.legs.length}</span>
                  <span class="when-expanded">Show recent 2</span>
                </span>
              </div>
            ` : ''}
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Done</th><th class="num">Leg</th><th class="num">Pit</th>
                  ${fuelMetrics().map(m => `<th class="num">${escapeHtml(m.short)}</th>`).join('')}
                </tr>
              </thead>
              <tbody>${legLog(runner, c)}</tbody>
            </table>
          </div>
        </div>
      </article>
    `;
  }

  function tick() {
    if (!cfg) return;
    const now = new Date();
    const start = new Date(cfg.startTime);
    const cutoffSec = (cfg.cutoffs?.totalHours || 0) * 3600;
    let diff = Math.floor((now - start) / 1000);
    const el = document.getElementById('elapsed');
    const label = document.getElementById('elapsed-label');
    if (diff < 0) {
      // Race hasn't started: count down to the gun.
      if (label) label.textContent = 'Race Starts In';
      el.textContent = Race.fmt.duration(-diff);
      el.style.color = 'var(--text-muted)';
    } else {
      if (label) label.textContent = 'Race Time Elapsed';
      const capped = Math.min(diff, cutoffSec || diff);
      el.textContent = Race.fmt.duration(capped);
      el.style.color = (cutoffSec && capped >= cutoffSec) ? 'var(--red)' : 'var(--text)';
    }
    document.querySelectorAll('.live-timer').forEach(t => {
      const since = t.dataset.since;
      if (!since) return;
      const base = parseFloat(t.dataset.base) || 0;
      const seconds = base + Math.max(0, (Date.now() - new Date(since).getTime()) / 1000);
      t.textContent = t.dataset.fmt === 'short'
        ? Race.fmt.durationShort(seconds)
        : Race.fmt.duration(seconds);
    });
    // Advance the predicted runner positions every second too.
    updateTracking();
  }

  async function load(opts) {
    try {
      // Stash any ?t=<share-token> for use by the worker reads (currently
      // share-link viewers read direct from Pages since the data is public;
      // when we move to private-backend storage this becomes mandatory).
      Race.share.captureFromUrl();

      // data.json is the live file and is read every poll. config.json is the
      // course, the roster and the fueling plan: it changes when somebody edits
      // the race, not when somebody presses a button, so re-reading it every
      // ten seconds doubled the cost of watching a race to keep an eye on
      // something that is almost never different. It is refreshed on the first
      // load and then at most once a minute, which is well inside the time it
      // takes anyone to walk from a laptop to an aid station.
      //
      // Both go through the worker for a signed-in reader, so a pit press
      // shows up within a poll rather than waiting on the Pages rebuild.
      if (!cfg || Date.now() - cfgFetchedAt > CFG_MAX_AGE_MS) {
        cfg = await Race.gh.readRaceJson(slug, 'config.json', true);
        cfgFetchedAt = Date.now();
      }
      // Replay anything this device logged but has not managed to send yet, so
      // a solo runner watching their own dashboard sees the split they just
      // pressed instead of wondering whether it took.
      data = Race.queue.applyTo(`races/${slug}/data.json`,
        await Race.gh.readRaceJson(slug, 'data.json', true));
      lastFetchAt = new Date();

      useShareableAddress(cfg);

      document.title = `${cfg.name} · SendOff`;
      document.getElementById('race-title').innerHTML =
        cfg.name.replace(/(\w+)$/, '<em>$1</em>');
      // Place and discipline read as one line: where it is and what it is.
      const actLabel = Race.activities.label(cfg);
      document.getElementById('brand-subtitle').textContent = [
        cfg.location || (cfg.courseType === 'loops' ? 'Loops' : 'Point-to-point'),
        actLabel
      ].filter(Boolean).join(' · ');


      renderCutoffs();

      const runnersById = new Map((cfg.runners || []).map(r => [r.id, r]));
      const merged = (data.runners || []).map(d => {
        const meta = runnersById.get(d.id) || {};
        return { ...meta, ...d };
      });
      // Include configured runners who don't have entries yet
      (cfg.runners || []).forEach(r => {
        if (!merged.find(m => m.id === r.id)) merged.push({ ...r, legs: [] });
      });

      const container = document.getElementById('runners');
      container.classList.toggle('single', merged.length === 1);
      container.innerHTML = merged.map(renderRunner).join('');
      mergedRunners = merged;

      document.getElementById('error').style.display = 'none';
      renderShareBanner();
      // The other three pages of this race, and the hub. The pit board only
      // appears for someone who can actually work it.
      Race.nav.setRace(slug, 'race', canEdit);
      updateLastUpdated();
      tick();
      initCourseVisuals();
      updateTracking();
      return true;
    } catch (err) {
      if (opts && opts.quiet) return false;
      const e = document.getElementById('error');
      // A race still inside its settling window is not missing, it is young.
      // Say so, and let the refresh loop keep trying. A dropped connection is
      // not that, and still gets reported as itself.
      if (!err.offline && stillSettling()) {
        e.className = 'info-banner';
        e.style.display = 'block';
        e.textContent = 'Finishing setup. This takes a few seconds.';
        return false;
      }
      e.className = 'error-banner';
      e.style.display = 'block';
      e.textContent = `Error loading race: ${err.message}`;
      return false;
    }
  }

  // A race arrived at straight from the wizard is younger than GitHub's
  // read-after-write consistency, and that consistency is not monotonic: the
  // wizard reading the config back is no promise that the next request, from
  // this page, sees it too. So the wizard marks the hop with ?new=1 and we wait
  // it out here rather than calling a race that plainly exists missing.
  //
  // Only this one navigation is patient. A mistyped race URL still fails at
  // once, which is what someone who typed it wrong needs.
  const NEW_RACE_WAIT_MS = 45000;

  // Dropping the ?new marker on first success left a gap: refresh a few
  // seconds later and the patient path was gone, so a read that had not caught
  // up yet drew the error banner over a race that was plainly fine. The marker
  // therefore outlives the URL, in this tab, for as long as a new race can
  // still be settling. A mistyped race URL has no note and still fails at
  // once, which is what someone who typed it wrong needs.
  const SETTLING_MS = 120000;
  const settleKey = 'sendoff-settling-' + slug;

  function noteSettling() {
    try { sessionStorage.setItem(settleKey, String(Date.now() + SETTLING_MS)); } catch (e) {}
  }
  function stillSettling() {
    try {
      const until = parseInt(sessionStorage.getItem(settleKey) || '0', 10);
      if (Date.now() < until) return true;
      if (until) sessionStorage.removeItem(settleKey);
    } catch (e) {}
    return false;
  }

  async function loadNewRace() {
    const title = document.getElementById('race-title');
    const note = document.getElementById('error');
    title.textContent = 'Setting up your race…';
    note.className = 'info-banner';
    note.style.display = 'block';
    note.textContent = 'Writing the course and roster. This takes a few seconds.';

    const deadline = Date.now() + NEW_RACE_WAIT_MS;
    while (Date.now() < deadline) {
      if (await load({ quiet: true })) {
        note.className = 'error-banner';
        note.style.display = 'none';
        // Drop the marker so a refresh, or a link someone copied out of the
        // address bar, behaves like any other visit to the race.
        try {
          const u = new URL(location.href);
          u.searchParams.delete('new');
          history.replaceState(null, '', u.pathname + u.search + u.hash);
        } catch (e) {}
        return;
      }
      await new Promise(r => setTimeout(r, 1200));
    }
    note.className = 'error-banner';
    load();  // one last try, this time saying what is actually wrong
  }

  // ---------- course visuals (Leaflet map + elevation profile) ----------
  // The route, aid markers and elevation profile are built once from
  // course.gpx. Predicted runner positions are refreshed on every load.
  const AID_END_COLOR = '#6ee7a8';
  const AID_MID_COLOR = '#0fb8bf';
  let courseVisualsReady = false;
  let courseMap = null, courseGpxPts = null;
  let mapRunnerMarkers = {};               // runnerId -> Leaflet marker
  let elevX = null, elevY = null;          // elevation-SVG scale fns
  let mergedRunners = [];                  // set by load()

  // The GPX point nearest a given cumulative mileage.
  function nearestGpxPoint(pts, mi) {
    let best = pts[0], bestDiff = Infinity;
    for (const p of pts) {
      const diff = Math.abs((p.dist || 0) - mi);
      if (diff < bestDiff) { bestDiff = diff; best = p; }
    }
    return best;
  }

  async function initCourseVisuals() {
    if (courseVisualsReady) return;

    // Through the worker first, like config.json and data.json, so the course
    // is not the one thing on the page still waiting for the Pages rebuild.
    // Null means no GPX, or none reachable yet; the refresh loop tries again.
    const gpxText = await Race.gh.readRaceText(slug, 'course.gpx', true);
    if (!gpxText) return;

    let pts;
    try { pts = Race.gpx.parse(gpxText); } catch (e) { return; }
    if (!pts.length) return;

    courseGpxPts = pts;
    courseVisualsReady = true;
    document.getElementById('course-map-section').style.display = '';
    const aids = Race.course.aidStations(cfg);

    const dist = Race.gpx.totalDistanceMi(pts);
    const elev = Race.gpx.totalElevation(pts);
    document.getElementById('course-map-meta').textContent =
      `${Race.units.distance(dist, cfg)} · +${Math.round(Race.units.elevationVal(elev.gainFt, cfg)).toLocaleString()} / -${Math.round(Race.units.elevationVal(elev.lossFt, cfg)).toLocaleString()} ${Race.units.elevationLabel(cfg)}`;

    // Elevation profile: pure SVG, so it renders even if Leaflet didn't load.
    try { renderElevationProfile(pts, aids); } catch (e) {}

    // Leaflet map: skipped gracefully if the library is unavailable.
    if (typeof L !== 'undefined') {
      courseMap = L.map('course-map', { scrollWheelZoom: false });
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 16
      }).addTo(courseMap);

      const line = L.polyline(pts.map(p => [p.lat, p.lon]), { color: AID_MID_COLOR, weight: 3, opacity: 0.9 }).addTo(courseMap);
      courseMap.fitBounds(line.getBounds(), { padding: [24, 24] });

      // One dot per place, not one per visit. A lapped course passes the same
      // aid four times and drew four dots a few metres apart, which read as
      // four stations. The passes are grouped and the dot sits at their median;
      // the tooltip lists every visit, so nothing is hidden by the merge.
      const placed = aids.map((aid, i) => {
        const p = nearestGpxPoint(pts, aid.mileage);
        return { name: aid.name, mileage: aid.mileage, isEnd: i === 0 || i === aids.length - 1,
                 lat: p.lat, lon: p.lon };
      });
      Race.gpx.clusterStops(placed).forEach(group => {
        // Start and finish share a field at most races, so a group holding
        // either is drawn as an end.
        const isEnd = group.members.some(m => m.isEnd);
        const label = group.members
          .map(m => `${escapeHtml(m.name)} · ${Race.units.distance(m.mileage, cfg)}`)
          .join('<br>');
        L.circleMarker([group.lat, group.lon], {
          radius: isEnd ? 6 : 5, color: '#fff', weight: 2,
          fillColor: isEnd ? AID_END_COLOR : AID_MID_COLOR, fillOpacity: 1
        }).addTo(courseMap).bindTooltip(label, { className: 'aid-marker-label', direction: 'top' });
      });

    } else {
      document.getElementById('course-map').style.display = 'none';
    }

    updateTracking();
  }

  // Elevation vs. distance SVG, with the same aid-station markers as the map.
  // A trailing <g id="elev-runners"> is left empty for updateTracking().
  function renderElevationProfile(pts, aids) {
    const svg = document.getElementById('course-elev');
    const W = 1000, H = 200, padL = 48, padR = 8, padT = 20, padB = 14;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const totalMi = pts[pts.length - 1].dist || 1;
    let minE = Infinity, maxE = -Infinity;
    for (const p of pts) {
      if (p.ele < minE) minE = p.ele;
      if (p.ele > maxE) maxE = p.ele;
    }
    if (maxE - minE < 1) maxE = minE + 1;
    const x = mi => padL + (Math.min(mi, totalMi) / totalMi) * plotW;
    const y = ele => padT + (1 - (ele - minE) / (maxE - minE)) * plotH;
    const baseY = padT + plotH;
    elevX = x; elevY = y;

    // Elevation scale: gridlines + feet labels down the left edge.
    let scale = `<text class="elev-axis-unit" x="${padL - 6}" y="11" text-anchor="end">${Race.units.elevationLabel(cfg)}</text>`;
    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const ele = minE + (i / yTicks) * (maxE - minE);
      const yy = y(ele).toFixed(1);
      const ft = Math.round(Race.units.elevationVal(Race.gpx.metersToFeet(ele), cfg));
      scale += `<line class="elev-grid" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" />` +
        `<text class="elev-axis-label" x="${padL - 6}" y="${yy}" text-anchor="end" dominant-baseline="middle">${ft.toLocaleString()}</text>`;
    }

    const linePts = pts.map(p => `${x(p.dist).toFixed(1)},${y(p.ele).toFixed(1)}`);
    const linePath = 'M' + linePts.join(' L');
    const areaPath = `M${x(0).toFixed(1)},${baseY.toFixed(1)} L${linePts.join(' L')} L${x(totalMi).toFixed(1)},${baseY.toFixed(1)} Z`;

    // Aid markers: a dot per aid; the name shows on hover (<title>) or tap.
    const marks = aids.map((aid, i) => {
      const ax = x(aid.mileage);
      const pt = nearestGpxPoint(pts, aid.mileage);
      const ay = y(pt.ele);
      const isEnd = i === 0 || i === aids.length - 1;
      const color = isEnd ? AID_END_COLOR : AID_MID_COLOR;
      const ft = Math.round(Race.units.elevationVal(Race.gpx.metersToFeet(pt.ele), cfg));
      const label = `${aid.name} · ${Race.units.distance(aid.mileage, cfg)}`;
      return `
        <line class="elev-aid-line" x1="${ax.toFixed(1)}" y1="${padT}" x2="${ax.toFixed(1)}" y2="${baseY.toFixed(1)}"
              stroke="${color}" stroke-opacity="0.3" />
        <circle class="elev-aid-dot" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="5"
                fill="${color}" stroke="#0a0f14" stroke-width="1.5" data-label="${escapeHtml(label)}">
          <title>${escapeHtml(label)} · ${ft.toLocaleString()} ${Race.units.elevationLabel(cfg)}</title>
        </circle>`;
    }).join('');

    svg.innerHTML = `
      ${scale}
      <path class="elev-area" d="${areaPath}" />
      <path class="elev-line" d="${linePath}" />
      ${marks}
      <g id="elev-aid-popup"></g>
      <g id="elev-runners"></g>`;

    // Tap an aid dot to show its name (in addition to the hover <title>).
    const popup = svg.querySelector('#elev-aid-popup');
    svg.addEventListener('click', (e) => {
      const dot = e.target.closest('.elev-aid-dot');
      if (!dot) { popup.innerHTML = ''; return; }
      const text = dot.getAttribute('data-label') || '';
      const cx = parseFloat(dot.getAttribute('cx'));
      const cy = parseFloat(dot.getAttribute('cy'));
      const h = 19, w = text.length * 6.3 + 16;
      let bx = Math.max(padL, Math.min(cx - w / 2, W - padR - w));
      let by = cy - h - 9;
      if (by < padT) by = cy + 9;
      popup.innerHTML =
        `<rect class="elev-popup-bg" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="3" />` +
        `<text class="elev-popup-text" x="${(bx + w / 2).toFixed(1)}" y="${(by + h / 2 + 0.5).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(text)}</text>`;
    });
  }

  // ---------- predictive runner tracking ----------
  // Position estimate comes from Race.compute.predictedMileage. Runners who
  // haven't started yet get no dot.
  function predictedPosition(runner) {
    const pos = Race.compute.predictedMileage(runner, cfg);
    return pos.state === 'idle' ? null : pos;
  }

  function trackingLabel(pos) {
    if (pos.state === 'finished') return 'finished';
    if (pos.state === 'in-pit') {
      return pos.atAid ? `in pit at ${pos.atAid}` : `in pit · ${Race.units.distance(pos.courseMi, cfg)}`;
    }
    return `~${Race.units.distance(pos.courseMi, cfg)} (est)`;
  }

  // Refreshes the predicted runner dots on the map and elevation profile.
  function updateTracking() {
    if (!courseVisualsReady || !courseGpxPts) return;
    const loopMode = cfg.courseType === 'loops';
    const loopDist = loopMode ? Race.course.loopDistance(cfg) : 0;
    // The GPX covers one lap for loops, the whole course for segments.
    const trackMi = courseMi =>
      (loopMode && loopDist > 0) ? (courseMi % loopDist) : courseMi;

    // Map: markers are moved in place (not cleared/re-added) so the
    // per-second updates don't flicker.
    if (courseMap) {
      const live = new Set();
      mergedRunners.forEach(r => {
        const pos = predictedPosition(r);
        if (!pos) return;
        live.add(r.id);
        const p = nearestGpxPoint(courseGpxPts, trackMi(pos.courseMi));
        const color = r.color || AID_MID_COLOR;
        const label = `${r.name} · ${trackingLabel(pos)}`;
        let m = mapRunnerMarkers[r.id];
        if (m) {
          m.setLatLng([p.lat, p.lon]);
          m.setStyle({ fillColor: color });
          m.setTooltipContent(label);
        } else {
          m = L.circleMarker([p.lat, p.lon], {
            radius: 7, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1,
            className: 'runner-dot'
          }).addTo(courseMap).bindTooltip(label, {
            permanent: true, direction: 'right', offset: [8, 0], className: 'runner-dot-label'
          });
          mapRunnerMarkers[r.id] = m;
        }
      });
      Object.keys(mapRunnerMarkers).forEach(id => {
        if (!live.has(id)) {
          courseMap.removeLayer(mapRunnerMarkers[id]);
          delete mapRunnerMarkers[id];
        }
      });
    }

    const g = document.getElementById('elev-runners');
    if (g && elevX && elevY) {
      g.innerHTML = mergedRunners.map(r => {
        const pos = predictedPosition(r);
        if (!pos) return '';
        const tmi = trackMi(pos.courseMi);
        const pt = nearestGpxPoint(courseGpxPts, tmi);
        const cx = elevX(tmi), cy = elevY(pt.ele);
        const color = r.color || AID_MID_COLOR;
        return `
          <circle class="runner-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5"
                  fill="${color}" stroke="#0a0f14" stroke-width="1.5">
            <title>${escapeHtml(r.name)} · ${escapeHtml(trackingLabel(pos))}</title>
          </circle>
          <text class="elev-runner-label" x="${cx.toFixed(1)}" y="${(cy - 9).toFixed(1)}"
                text-anchor="middle" fill="${color}">${escapeHtml(r.name)}</text>`;
      }).join('');
    }
  }

  // ---------- share banner (anonymous shared view) ----------
  function renderShareBanner() {
    const banner = document.getElementById('share-banner');
    const tok = Race.share.get();
    if (tok && !Race.auth.has() && cfg.visibility === 'private') {
      banner.style.display = '';
      banner.innerHTML = `
        <span><span class="em">Shared view</span> · read-only via share link</span>
        <span style="color: var(--text-muted);">${escapeHtml(cfg.name || '')}</span>
      `;
    } else {
      banner.style.display = 'none';
    }
  }

  // ---------- finish card ----------
  // Offered only once someone has finished, because that is the only moment it
  // is true. Drawn from what this page already has, on this device.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-card]');
    if (!btn || !window.FinishCard) return;
    const runner = (mergedRunners || []).find(r => r.id === btn.dataset.card);
    if (!runner) return;
    FinishCard.open({ cfg, runner, gpxPts: courseGpxPts });
  });

  // ---------- access ----------
  // Managing a race happens on the settings page. What this page still needs
  // to know is the one question that gates the Pit Board, Racer and Settings
  // links in the menu: may this person edit.
  function isProxyMode() { return Race.hub.isProxyMode(); }
  function currentEmail() { return Race.auth.email(); }
  function canManage() {
    if (!isProxyMode() || !Race.auth.has()) return false;
    return Race.roles.canEdit(cfg, currentEmail());
  }
  // In proxy mode it's the per-race ACL; in direct/PAT mode it's whether this
  // device has a token stored.
  function canEdit() {
    return isProxyMode() ? canManage() : Race.config.has();
  }

  function updateLastUpdated() {
    if (!data) return;
    const lu = data.lastUpdated
      ? `Data updated ${new Date(data.lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
      : 'Awaiting start';
    let live = '';
    if (lastFetchAt) {
      const ago = Math.max(0, Math.floor((Date.now() - lastFetchAt.getTime()) / 1000));
      live = ago < 5 ? ' · live' : ` · checked ${ago}s ago`;
    }
    document.getElementById('last-updated').textContent = lu + live;
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action="toggle-leglog"]');
    if (!t) return;
    const id = t.dataset.runner;
    const log = t.closest('.leglog');
    if (!log) return;
    const nowCollapsed = !log.classList.contains('collapsed');
    log.classList.toggle('collapsed', nowCollapsed);
    const s = loadLeglogState();
    s[id] = nowCollapsed;
    saveLeglogState(s);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') load();
  });

  // hub.json is what says reads should go through the worker, and it is
  // fetched asynchronously. Starting before it resolves meant the very first
  // load, the one whose wait anyone actually notices, always took the Pages
  // path and so waited on the rebuild no matter what the rest of this does.
  Race.hub.load().then(() => {
    if (Race.qs('new')) { noteSettling(); loadNewRace(); } else load();
  });
  setInterval(tick, 1000);
  setInterval(updateLastUpdated, 1000);
  // Adaptive: fast while the race is running and somebody is looking, slow
  // once it is over, and nothing at all while the tab is hidden. See
  // Race.poll. Coming back to the tab refreshes at once.
  //
  // When the live socket is connected the poll drops right back but does not
  // stop. A socket can be quietly killed by a captive portal or a sleeping
  // phone without saying so, and a spectator who has stopped receiving
  // anything has no way to tell. The poll underneath is what makes that a
  // slower page rather than a wrong one.
  // Declared before the poller because Race.poll asks for an interval
  // immediately, and reading a const before its line has run is a throw, not
  // a falsy value.
  let pushed = { connected: false };
  const poller = Race.poll(load, {
    interval: () => (pushed.connected ? 60000 : Race.POLL_MS[Race.raceState(cfg, data)])
  });
  pushed = Race.live(slug, () => poller.now());
</script>

</body>
</html>
