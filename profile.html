<style>
  .p-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 26px; }
  /* display: flex above would otherwise win over the hidden attribute, and
     the buttons would show to somebody signed out. */
  .p-actions[hidden] { display: none; }
  .p-section { margin: 0 0 34px; }
  .p-h2 {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px;
  }
  .p-totals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .p-total { background: var(--bg-card); padding: 14px 16px; }
  .p-total b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  .p-total span { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-muted); }
  @media (max-width: 700px) {
    .p-totals { grid-template-columns: repeat(2, 1fr); }
    .p-total:last-child { grid-column: 1 / -1; }
  }
  footer.site a { color: var(--accent); }

  .p-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    padding: 18px 20px; margin-bottom: 14px; }
  .p-fam { margin-bottom: 14px; }
  .p-fam h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .p-best { display: grid; grid-template-columns: 9em 7.5em 1fr; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--border); align-items: baseline; }
  .p-best:first-of-type { border-top: 0; }
  .p-best .k { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted); }
  .p-best .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .p-best .r { color: var(--text-dim); font-size: 13px; }
  @media (max-width: 520px) { .p-best { grid-template-columns: 1fr auto; } .p-best .r { grid-column: 1 / -1; } }

  .p-race-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .p-race-name { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1; }
  .p-race-name a { color: inherit; text-decoration: none; }
  .p-race-name a:hover { color: var(--accent); }
  .p-sub { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 4px; }
  .p-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 4px 8px; border: 1px solid var(--border-bright); border-radius: 3px; white-space: nowrap; color: var(--text-dim); }
  .p-chip.done { color: var(--green); border-color: var(--green); }
  .p-chip.dnf { color: var(--yellow); border-color: var(--yellow); }
  .p-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 14px 0 4px; }
  .p-stat { font-family: 'JetBrains Mono', monospace; }
  .p-stat b { font-size: 17px; }
  .p-stat span { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .p-note { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  .p-report { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin: 12px 0 0; white-space: pre-wrap; }
  .p-report b { color: var(--text); font-weight: 600; }
  .p-row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .p-form { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .p-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
  .p-grid .wide { grid-column: 1 / -1; }
  .p-form .modal-field input, .p-form .modal-field select, .p-form .modal-field textarea { width: 100%; box-sizing: border-box; }
  /* A div, not a span: .modal-field > span is the field's label style. */
  .p-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
  .p-pair em { color: var(--text-muted); font-style: normal; font-size: 12px; }
  .p-check { display: flex; gap: 8px; align-items: center; margin: 2px 0 12px; font-size: 14px; color: var(--text-dim); }
  .p-err { color: var(--red); font-size: 13px; min-height: 1em; margin: 6px 0 0; }
  @media (max-width: 520px) { .p-grid { grid-template-columns: 1fr; } }

  .p-link { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--border); }
  .p-link:first-of-type { border-top: 0; }
  .p-empty { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .p-link-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .p-hidden-line { margin: 8px 0 0; }
  .p-tools { display: grid; gap: 10px; margin: 0 0 14px; }
  /* The theme's input style, which leaves search boxes to each page. */
  .p-tools input[type="search"] { width: 100%; box-sizing: border-box; background: var(--bg-elevated); color: var(--text);
    border: 1px solid var(--border-bright); border-radius: 4px; padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .p-tools input[type="search"]::placeholder { color: var(--text-muted); }
  .p-chips { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .p-chips[hidden] { display: none; }
  .p-chips .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .p-fchip { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    padding: 6px 11px; border: 1px solid var(--border-bright); border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--text-dim); }
  .p-fchip:hover { color: var(--text); }
  .p-fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  .p-chips select { width: auto; padding-top: 5px; padding-bottom: 5px; }
  .p-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 0 0 10px; }
  .p-more { display: flex; justify-content: center; margin: 4px 0 0; }
  .p-uname .p-card { display: grid; gap: 10px; }
  .p-handle { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent); overflow-wrap: anywhere; }
  .p-uname-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .p-uname-field { display: flex; align-items: stretch; flex: 1 1 220px; min-width: 0; }
  .p-uname-field span { display: flex; align-items: center; padding: 0 10px; border: 1px solid var(--border-bright);
    border-right: 0; border-radius: 4px 0 0 4px; background: var(--bg-elevated); color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; }
  .p-uname-field input { border-radius: 0 4px 4px 0; min-width: 0; }
  .p-uname-msg { font-size: 13px; color: var(--text-muted); margin: 0; min-height: 1.2em; }
  .p-uname-msg.ok { color: var(--green); } .p-uname-msg.err { color: var(--red); }
  .p-uname-help { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin: 0; }
  .p-pub .p-card { display: grid; gap: 10px; }
  .p-pub-addr { font-family: 'JetBrains Mono', monospace; font-size: 14px; overflow-wrap: anywhere; }
  .p-pub-addr a { color: var(--accent); }
  .p-race-pub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-muted); }
  .p-race-pub .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .p-pubchip { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--text-dim); border: 1px solid var(--border-bright); }
  .p-pubchip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .p-textbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-decoration: underline; }
</style>

troke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /><path d="M 56.0 208 L 600.0 208" fill="none" stroke="var(--wm-letter, #F0ECE3)" stroke-width="112" stroke-linecap="butt" stroke-linejoin="round" /></g><path d="M -20.0 870.0 L 1224.0 870.0 L 1304.0 818.8 L 1384.0 850.8 L 1474.0 742.0 L 1554.0 793.2 L 1664.0 550.0 L 1754.0 927.6 L 1844.0 729.2 L 1934.0 806.0 L 2024.0 774.0 L 2124.0 844.4 L 2224.0 870.0 L 3468.0 870.0" fill="none" stroke="var(--wm-signal, #0FB8BF)" stroke-width="62.7" stroke-linecap="round" stroke-linejoin="round" /></g></svg></a><span>·</span><span>Profile</span><span>·</span>

<script src="lib/race-core.js?v=9ba112c5"></script>
<script>
  // The racer profile: every race this account ran, what it adds up to, and
  // what the racer has written about each since. See ROADMAP.md, "Racer
  // profile page". Private to the account for now; a public profile is a
  // separate step with its own rules about what it may show.
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);
  let state = null;          // what /my-results answered
  // Read-only, for anyone: a public profile, at /@name or /u/name (or
  // ?u=name), drawn by this same page from what /public-profile allows.
  const PUBLIC_NAME = (() => {
    const m = location.pathname.match(/^\/(?:@|u\/)([A-Za-z0-9_.]{1,40})\/?$/);
    return m ? m[1] : (new URLSearchParams(location.search).get('u') || '').replace(/^@/, '') || null;
  })();
  const PUBLIC = !!PUBLIC_NAME;
  // The public answer carries no addresses; this stands in for the racer so
  // the archive can find their runner the way it does on the private page.
  const PUBLIC_ME = 'public-profile@sendoff.invalid';
  let openForm = null;       // which card's form is open: a slug, a manual id, or 'new'

  // Finding a race in a long list. All of it is already here from one
  // /my-results answer, so searching, filtering and "show more" are only a
  // question of which cards to draw. The filter lives in the address, so a
  // refresh, the back button and a bookmark all keep it.
  const PAGE = 10;           // cards drawn at first, and per "Show more"
  const TOOLS_AT = 9;        // below this many races the list needs no tools
  const OUTCOMES = { finished: 'Finished', dnf: 'Did not finish', upcoming: 'Not started' };
  let shown = PAGE;
  const filter = (() => {
    const q = new URLSearchParams(location.search);
    const pick = (k, ok) => { const v = q.get(k) || ''; return ok(v) ? v : ''; };
    return { q: (q.get('q') || '').slice(0, 100),
             d: pick('d', v => Object.prototype.hasOwnProperty.call(Race.archive.FAMILIES, v)),
             o: pick('o', v => Object.prototype.hasOwnProperty.call(OUTCOMES, v)),
             y: pick('y', v => /^\d{4}$/.test(v)) };
  })();
  const filtering = () => !!(filter.q.trim() || filter.d || filter.o || filter.y);
  const keyOf = r => r.manual ? r.id : r.slug;
  const outcomeOf = r => r.finished ? 'finished' : (r.dnf || r.legsDone) ? 'dnf' : 'upcoming';
  const yearOf = r => r.startTime ? String(new Date(r.startTime).getFullYear()) : '';
  function matches(r) {
    if (filter.d && r.family !== filter.d) return false;
    if (filter.o && outcomeOf(r) !== filter.o) return false;
    if (filter.y && yearOf(r) !== filter.y) return false;
    const words = filter.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const act = Race.activities.find(r.activity);
    const hay = [r.name, r.location, act && act.label].filter(Boolean).join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }
  function saveFilter() {
    const q = new URLSearchParams(location.search);
    for (const k of ['q', 'd', 'o', 'y']) { const v = k === 'q' ? filter.q.trim() : filter[k]; if (v) q.set(k, v); else q.delete(k); }
    const qs = q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  // "35:41:15", "35:41" or "2:05:00" to seconds. Hours may run past 24.
  function parseTime(s) {
    const parts = String(s || '').trim().split(':').map(p => p.trim());
    if (!parts[0]) return null;
    if (parts.length < 2 || parts.length > 3 || parts.some(p => !/^\d+$/.test(p))) return NaN;
    const [h, m, sec] = parts.length === 3 ? parts.map(Number) : [...parts.map(Number), 0];
    if (m > 59 || sec > 59) return NaN;
    return h * 3600 + m * 60 + sec;
  }
  const hms = sec => sec > 0 ? Race.fmt.duration(sec) : '–';
  const miles = mi => mi ? (Math.round(mi * 10) / 10).toLocaleString() + ' mi' : '–';
  const feet = ft => ft != null ? '+' + Math.round(ft).toLocaleString() + ' ft' : '–';
  const date = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

  // The results, in the shape Race.archive works in: SendOff races with what
  // the racer entered applied over them, and hand-entered races beside them.
  function results() {
    const out = [];
    for (const r of state.races) {
      const cfg = Object.assign({ slug: r.slug }, r.config);
      const base = Race.archive.resultFor(cfg, { runners: [r.runner] }, state.email);
      if (!base) continue;
      base.visibility = r.visibility;
      out.push(Race.archive.withEntered(base, state.results.bySlug[r.slug]));
    }
    for (const m of state.results.manual) out.push(Race.archive.fromManual(m));
    return Race.archive.sort(out);
  }

  function renderTotals(list) {
    const t = Race.archive.totals(list);
    const hrs = t.sec ? Math.round(t.sec / 3600).toLocaleString() + ' h' : '–';
    return `<section class="p-section"><h2 class="p-h2">All of it</h2><div class="p-totals">
      <div class="p-total"><b>${t.started}</b><span>Races</span></div>
      <div class="p-total"><b>${t.finished}</b><span>Finished</span></div>
      <div class="p-total"><b>${Math.round(t.miles).toLocaleString()}</b><span>Miles</span></div>
      <div class="p-total"><b>${Math.round(t.climbFt).toLocaleString()}</b><span>Feet climbed</span></div>
      <div class="p-total"><b>${hrs}</b><span>On course</span></div>
    </div></section>`;
  }

  function renderBests(list) {
    const fams = Race.archive.recordsByFamily(list).filter(f => f.finishedCount);
    if (!fams.length) return '';
    const line = (k, v, r) => r ? `<div class="p-best"><span class="k">${esc(k)}</span><span class="v">${v}</span>
      <span class="r">${esc(r.name)} · ${esc(date(r.startTime))}</span></div>` : '';
    return `<section class="p-section"><h2 class="p-h2">Personal bests</h2>` + fams.map(f => `
      <div class="p-card p-fam"><h3>${esc(f.label)}</h3>
        ${Object.values(f.byBucket).map(b => line(b.bucket.label, hms(b.race.finishSec), b.race)).join('')}
        ${line('Furthest', miles(f.furthest && f.furthest.distanceMi), f.furthest)}
        ${line('Most climb', feet(f.mostClimb && f.mostClimb.elevGainFt), f.mostClimb)}
        ${line('Longest day', hms(f.longestDay && f.longestDay.finishSec), f.longestDay)}
      </div>`).join('') + `</section>`;
  }

  let showHidden = false;    // whether the races put aside with "Not me" are listed

  function renderCandidates() {
    const offered = state.candidates || [], hidden = state.hidden || [];
    if (!offered.length && !hidden.length) return '';
    const row = (c, buttons) => `<div class="p-link"><span><b>${esc(c.name)}</b>
        <span class="p-sub">${esc(date(c.startTime))}</span></span><span class="p-link-btns">${buttons}</span></div>`;
    const offeredRows = offered.map(c => row(c,
      c.runners.map(r => `<button type="button" class="btn" data-link="${esc(c.slug)}" data-runner="${esc(r.id)}">I'm ${esc(r.name)}</button>`).join(' ') +
      ` <button type="button" class="btn" data-notmine="${esc(c.slug)}" title="Stop offering this race">Not me</button>`)).join('');
    const hiddenRows = showHidden ? hidden.map(c => row(c,
      `<button type="button" class="btn" data-unhide="${esc(c.slug)}">Show again</button>`)).join('') : '';
    const hiddenLine = hidden.length ? `<p class="p-hidden-line"><button type="button" class="p-textbtn" id="toggle-hidden">${
      showHidden ? 'Hide' : 'Show'} ${hidden.length} race${hidden.length === 1 ? '' : 's'} you said ${hidden.length === 1 ? 'is' : 'are'} not you</button></p>` : '';
    return `<section class="p-section"><h2 class="p-h2">Are any of these you?</h2><div class="p-card">
      ${offered.length ? `<p class="p-empty" style="margin:0 0 6px">Races you made or are on, with a racer not linked to any account.
      Linking one puts it on this page and lets you log your own splits there. Not yours? Tap Not me and it stops being offered.</p>` : ''}
      ${offeredRows}${hiddenRows}${hiddenLine}</div></section>`;
  }

  function placeLine(e) {
    if (!e) return '';
    const bits = [];
    const one = (p, f, what) => { if (p) bits.push(`${p}${f ? ' of ' + f : ''} ${what}`); };
    one(e.placeOverall, e.fieldOverall, 'overall');
    one(e.placeGender, e.fieldGender, 'gender');
    one(e.placeAge, e.fieldAge, e.ageGroup ? esc(e.ageGroup) : 'age group');
    return bits.length ? `<div class="p-stat"><b>${bits[0]}</b><span>${bits.slice(1).join(' · ') || 'Place'}</span></div>` : '';
  }

  function intakeLine(r) {
    const ph = r.perHour || {};
    const bits = [];
    if (ph.calories) bits.push(`${Math.round(ph.calories)} cal`);
    if (ph.sodiumMg) bits.push(`${Math.round(ph.sodiumMg)} mg sodium`);
    if (ph.fluidOz) bits.push(`${Math.round(ph.fluidOz * 10) / 10} oz`);
    if (!bits.length) return '';
    return `<div class="p-stat"><b>${bits.join(' · ')}</b><span>Per hour${r.loggedThroughLeg ? ', logged through leg ' + r.loggedThroughLeg : ''}</span></div>`;
  }

  function raceCard(r) {
    const e = r.entered || null;
    const key = r.manual ? r.id : r.slug;
    const status = r.finished ? `<span class="p-chip done">Finished</span>`
      : (r.dnf ? `<span class="p-chip dnf">DNF</span>` : `<span class="p-chip">${r.legsDone ? 'Did not finish' : 'Not started'}</span>`);
    const name = r.manual ? esc(r.name) : `<a href="${esc(Race.raceHref(r.slug, r.visibility === 'public'))}">${esc(r.name)}</a>`;
    const act = Race.activities.find(r.activity);
    const sub = [date(r.startTime), r.location, act && act.label, r.manual ? 'Entered by hand' : (r.visibility === 'private' ? 'Private race' : '')]
      .filter(Boolean).map(esc).join(' · ');
    const timeLabel = r.finished ? (r.official ? 'Official time' : 'Logged time') : 'Time on course';
    const time = r.finished ? hms(r.finishSec) : hms(r.raceSec);
    const covered = r.finished ? r.distanceMi : (r.milesDone || 0);
    // A race with no clock on it (a DNF entered by hand) says where it ended
    // rather than showing a dash for a time nobody recorded.
    const timeStat = (r.finished || r.raceSec)
      ? `<div class="p-stat"><b>${time}</b><span>${timeLabel}</span></div>` : '';
    const where = r.dnf && e && e.dnfWhere
      ? `<div class="p-stat"><b>${esc(e.dnfWhere)}</b><span>Stopped at</span></div>` : '';
    const report = e && (e.report || e.changeNext) ? `<p class="p-report">${e.report ? esc(e.report) : ''}${
      e.report && e.changeNext ? '\n\n' : ''}${e.changeNext ? '<b>Next time:</b> ' + esc(e.changeNext) : ''}</p>` : '';
    return `<article class="p-card" data-key="${esc(key)}">
      <div class="p-race-head"><div><div class="p-race-name">${name}</div><div class="p-sub">${sub}</div></div>${status}</div>
      <div class="p-stats">
        ${timeStat}${where}
        ${covered ? `<div class="p-stat"><b>${miles(covered)}</b><span>${r.finished ? 'Distance' : 'Covered'}</span></div>` : ''}
        ${r.elevGainFt != null ? `<div class="p-stat"><b>${feet(r.elevGainFt)}</b><span>Climb</span></div>` : ''}
        ${r.aidSec ? `<div class="p-stat"><b>${hms(r.aidSec)}</b><span>In aid stations</span></div>` : ''}
        ${placeLine(e)}
        ${intakeLine(r)}
      </div>
      ${r.finished && r.official && !r.manual && r.raceSec && Math.abs(r.raceSec - r.finishSec) >= 60
        ? `<div class="p-note">Logged on SendOff: ${hms(r.raceSec)}</div>` : ''}
      ${report}
      ${PUBLIC && !(e && e.resultsUrl) ? '' : `<div class="p-row-actions">
        ${PUBLIC ? '' : `<button type="button" class="btn" data-edit="${esc(key)}">${e ? 'Edit result' : 'Add result'}</button>`}
        ${e && e.resultsUrl ? `<a class="btn" href="${esc(e.resultsUrl)}" target="_blank" rel="noopener">Official results</a>` : ''}
      </div>`}
      ${pubControls(r)}
      ${openForm === key ? resultForm(r) : ''}
    </article>`;
  }

  // One form for both: a SendOff race needs only what happened afterwards; a
  // race from before SendOff also needs to say what the race was.
  function resultForm(r) {
    const e = (r && r.entered) || {};
    const manual = !r || r.manual;
    const v = x => x == null ? '' : esc(x);
    const opts = Race.activities.all.map(a =>
      `<option value="${a.key}"${(e.activity || 'trail-run') === a.key ? ' selected' : ''}>${esc(a.label)}</option>`).join('');
    const pair = (a, b, la, lb) => `<div class="p-pair"><input type="number" min="1" name="${a}" placeholder="${la}" value="${v(e[a])}">
      <em>of</em><input type="number" min="1" name="${b}" placeholder="${lb}" value="${v(e[b])}"></div>`;
    return `<form class="p-form" data-form="${esc(r ? (r.manual ? r.id : r.slug) : 'new')}" novalidate>
      <div class="p-grid">
        ${manual ? `
        <label class="modal-field wide"><span>Race</span><input type="text" name="name" maxlength="120" value="${v(e.name)}" placeholder="Leadville Trail 100"></label>
        <label class="modal-field"><span>Date</span><input type="date" name="date" value="${v(e.date)}"></label>
        <label class="modal-field"><span>Discipline</span><select name="activity">${opts}</select></label>
        <label class="modal-field"><span>Distance (miles)</span><input type="number" step="0.1" min="0" name="distanceMi" value="${v(e.distanceMi)}"></label>
        <label class="modal-field"><span>Climb (feet, optional)</span><input type="number" min="0" name="climbFt" value="${v(e.climbFt)}"></label>
        <label class="modal-field wide"><span>Where (optional)</span><input type="text" name="location" maxlength="120" value="${v(e.location)}"></label>` : ''}
        <label class="modal-field"><span>Official finish time</span><input type="text" name="official" placeholder="35:41:15" inputmode="numeric"
          value="${e.officialSec ? Race.fmt.duration(e.officialSec) : ''}"></label>
        <label class="modal-field"><span>Results link</span><input name="resultsUrl" type="url" maxlength="500" placeholder="https://" value="${v(e.resultsUrl)}"></label>
        <label class="p-check wide"><input type="checkbox" name="dnf"${e.dnf ? ' checked' : ''}> Did not finish</label>
        <label class="modal-field wide"><span>Where you stopped (for a DNF)</span><input type="text" name="dnfWhere" maxlength="120" value="${v(e.dnfWhere)}" placeholder="Mile 86"></label>
        <label class="modal-field"><span>Place overall</span>${pair('placeOverall', 'fieldOverall', 'place', 'field')}</label>
        <label class="modal-field"><span>Place by gender</span>${pair('placeGender', 'fieldGender', 'place', 'field')}</label>
        <label class="modal-field"><span>Age group</span><input type="text" name="ageGroup" maxlength="20" value="${v(e.ageGroup)}" placeholder="M40-49"></label>
        <label class="modal-field"><span>Place in age group</span>${pair('placeAge', 'fieldAge', 'place', 'field')}</label>
        <label class="modal-field wide"><span>Race report</span><textarea name="report" maxlength="5000">${v(e.report)}</textarea></label>
        <label class="modal-field wide"><span>What I'd change next time</span><textarea name="changeNext" maxlength="1000">${v(e.changeNext)}</textarea></label>
      </div>
      <p class="p-err" data-err></p>
      <div class="p-row-actions">
        <button type="submit" class="btn primary">Save</button>
        <button type="button" class="btn" data-cancel>Cancel</button>
        ${r && r.entered ? `<button type="button" class="btn danger" data-remove>${r.manual ? 'Delete this race' : 'Clear result'}</button>` : ''}
      </div>
    </form>`;
  }

  // The search box is drawn once per render() and left alone while somebody
  // types in it; the chips and the cards below it are redrawn on each change.
  function renderTools(list) {
    if (list.length < TOOLS_AT && !filtering()) return '';
    return `<div class="p-tools">
      <input type="search" id="race-q" placeholder="Search by race or place" aria-label="Search your races"
             autocomplete="off" spellcheck="false" value="${esc(filter.q)}">
      <div class="p-chips" id="race-chips"></div>
    </div>`;
  }

  function renderChips(list) {
    const host = $('race-chips');
    if (!host) return;
    const count = (fn) => { const m = new Map(); for (const r of list) { const k = fn(r); if (k) m.set(k, (m.get(k) || 0) + 1); } return m; };
    const fams = count(r => r.family), outs = count(outcomeOf), years = count(yearOf);
    const chip = (dim, val, label) => `<button type="button" class="p-fchip" data-f="${dim}" data-v="${esc(val)}"
      aria-pressed="${filter[dim] === val}">${esc(label)}</button>`;
    // A choice that cannot narrow anything is not offered: one discipline,
    // one outcome or one year is not a filter. One already chosen stays, so
    // it can be taken off.
    const group = (dim, m, labels) => (m.size > 1 || filter[dim])
      ? Object.keys(labels).filter(k => m.has(k) || filter[dim] === k).map(k => chip(dim, k, labels[k])).join('') : '';
    const parts = [group('d', fams, Race.archive.FAMILIES), group('o', outs, OUTCOMES)].filter(Boolean);
    if (years.size > 1 || filter.y) {
      const ys = [...new Set([...years.keys(), filter.y].filter(Boolean))].sort().reverse();
      parts.push(`<select id="race-year" aria-label="Year"><option value="">Any year</option>${
        ys.map(y => `<option value="${esc(y)}"${filter.y === y ? ' selected' : ''}>${esc(y)}</option>`).join('')}</select>`);
    }
    if (filtering()) parts.push(`<button type="button" class="p-textbtn" data-clear>Clear</button>`);
    host.innerHTML = parts.join('<span class="sep" aria-hidden="true"></span>');
    host.hidden = !parts.length;
  }

  function renderList(list) {
    renderChips(list);
    const host = $('race-list');
    if (!host) return;
    if (!list.length) {
      host.innerHTML = `<p class="p-empty">No races on your profile yet. A race shows up here once you are linked to a racer on it,
       which is done on the race's settings page, or with the buttons above when SendOff can tell which racer you are.
       Races from before SendOff can be added with the button at the top.</p>`;
      return;
    }
    const matched = list.filter(matches);
    if (!matched.length) {
      host.innerHTML = `<p class="p-empty">No races match.</p><p><button type="button" class="btn" data-clear>Clear the search and filters</button></p>`;
      return;
    }
    // A card somebody is writing in stays, whatever the filter says.
    const keep = new Set(matched.slice(0, shown).map(keyOf));
    if (openForm && list.some(r => keyOf(r) === openForm)) keep.add(openForm);
    const drawn = list.filter(r => keep.has(keyOf(r)));
    const showing = Math.min(shown, matched.length);
    const of = filtering() ? `${matched.length} of ${list.length} races match` : `${list.length} races`;
    const count = list.length < TOOLS_AT && !filtering() ? ''
      : `<p class="p-count" aria-live="polite">${showing < matched.length ? `Showing ${showing} of ${matched.length} · ` : ''}${of}</p>`;
    const left = matched.length - showing;
    const more = left > 0 ? `<div class="p-more"><button type="button" class="btn" id="race-more">${
      left > PAGE ? `Show ${PAGE} more` : `Show the last ${left}`}</button></div>` : '';
    host.innerHTML = count + drawn.map(raceCard).join('') + more;
  }

  function render() {
    const list = results();
    if (PUBLIC) {
      $('body').innerHTML = (list.length ? renderTotals(list) + renderBests(list) : '') +
        `<section class="p-section"><h2 class="p-h2">Races</h2>${renderTools(list)}<div id="race-list"></div></section>`;
      renderList(list);
      return;
    }
    $('actions').hidden = false;
    const newForm = openForm === 'new'
      ? `<section class="p-section"><h2 class="p-h2">A race from before SendOff</h2><div class="p-card">${resultForm(null)}</div></section>` : '';
    $('body').innerHTML = newForm + renderCandidates() + renderTotals(list) + renderBests(list) +
      `<section class="p-section"><h2 class="p-h2">Races</h2>${renderTools(list)}<div id="race-list"></div></section>`;
    renderList(list);
  }

  // A change to the filter starts the list from the top again.
  function refilter() { shown = PAGE; saveFilter(); renderList(results()); }
  document.addEventListener('input', (e) => {
    if (e.target.id === 'race-q') { filter.q = e.target.value; refilter(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'race-year') { filter.y = e.target.value; refilter(); }
  });

  function formValues(form) {
    const f = Object.fromEntries(new FormData(form).entries());
    const out = {};
    const sec = parseTime(f.official);
    if (Number.isNaN(sec)) throw Object.assign(new Error('Finish time as hours:minutes:seconds, like 35:41:15.'), { field: 'official' });
    if (sec) out.officialSec = sec;
    out.dnf = !!form.elements.dnf.checked;
    for (const k of ['resultsUrl', 'dnfWhere', 'ageGroup', 'report', 'changeNext', 'name', 'date', 'location', 'activity'])
      if (f[k] != null && f[k] !== '') out[k] = f[k];
    for (const k of ['placeOverall', 'fieldOverall', 'placeGender', 'fieldGender', 'placeAge', 'fieldAge', 'distanceMi', 'climbFt'])
      if (f[k] != null && f[k] !== '') out[k] = Number(f[k]);
    return out;
  }

  document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.id === 'edit-profile') return Race.openProfileModal();
    if (t.id === 'add-manual') { openForm = 'new'; render(); const f = document.querySelector('[data-form="new"] input'); if (f) f.focus(); return; }
    if (t.dataset.edit) { openForm = openForm === t.dataset.edit ? null : t.dataset.edit; render(); return; }
    if (t.hasAttribute && t.hasAttribute('data-cancel')) { openForm = null; render(); return; }
    if (t.hasAttribute && t.hasAttribute('data-remove')) {
      const key = t.closest('form').dataset.form;
      const manual = key.startsWith('m-');
      if (!confirm(manual ? 'Delete this race from your profile?' : 'Clear what you entered for this race? The race itself stays.')) return;
      const r = await Race.api.deleteResult(manual ? { id: key } : { slug: key });
      state.results = r.results; openForm = null; render(); return;
    }
    if (t.id === 'race-more') {
      const first = document.querySelectorAll('#race-list .p-card').length;
      shown += PAGE; renderList(results());
      // Keyboard and screen reader users land on the first new card, not
      // back at the top of the list.
      const next = document.querySelectorAll('#race-list .p-card')[first];
      const a = next && next.querySelector('a, button');
      if (a) a.focus({ preventScroll: true });
      return;
    }
    const chip = t.closest && t.closest('[data-f]');
    if (chip) {
      const { f, v } = chip.dataset;
      filter[f] = filter[f] === v ? '' : v;
      refilter();
      // The chip was drawn again; keep the keyboard on it.
      const again = [...document.querySelectorAll('#race-chips [data-f]')].find(b => b.dataset.f === f && b.dataset.v === v);
      if (again) again.focus();
      return;
    }
    if (t.closest && t.closest('[data-clear]')) {
      Object.assign(filter, { q: '', d: '', o: '', y: '' });
      const box = $('race-q'); if (box) box.value = '';
      refilter(); return;
    }
    if (t.id === 'toggle-hidden') { showHidden = !showHidden; render(); return; }
    if (t.dataset.notmine || t.dataset.unhide) {
      t.disabled = true;
      const slug = t.dataset.notmine || t.dataset.unhide;
      try { await Race.api.notMine(slug, !!t.dataset.unhide); await load(); }
      catch (err) { t.disabled = false; showError('Could not update that race: ' + (err.message || err)); }
      return;
    }
    if (t.dataset.link) {
      t.disabled = true;
      const slug = t.dataset.link, id = t.dataset.runner;
      try {
        // An ordinary config save, the same one the settings page makes when
        // it links a racer: the worker moves the address out of the file.
        await Race.gh.mutateJson(Race.auth.cfg(), `races/${slug}/config.json`, (doc) => {
          const run = (doc.runners || []).find(x => x.id === id);
          if (run && !run.email) run.email = state.email;
          return doc;
        }, `profile: link a racer on ${slug}`);
        await load();
      } catch (err) { t.disabled = false; showError('Could not link that race: ' + (err.message || err)); }
    }
  });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const err = form.querySelector('[data-err]');
    err.textContent = '';
    const key = form.dataset.form;
    const btn = form.querySelector('button[type=submit]');
    try {
      const result = formValues(form);
      const body = key === 'new' ? { result } : key.startsWith('m-') ? { id: key, result } : { slug: key, result };
      btn.disabled = true;
      const r = await Race.api.saveResult(body);
      state.results = r.results; openForm = null; render();
    } catch (ex) {
      btn.disabled = false;
      err.textContent = ex.message || String(ex);
      const field = ex.field === 'officialSec' ? 'official' : ex.field;
      const el = field && form.elements[field];
      if (el && el.focus) el.focus();
    }
  });

  // ---------- public profile ----------
  // Off until switched on. The card says what going public shows and what it
  // never does; each race card then carries its own switches.
  let pub = null;
  async function loadPub() {
    try { pub = await Race.api.publicSettings(); } catch (e) { pub = null; }
    renderPub();
    // The race cards carry their switches once it is known whether it is on.
    if (state && $('race-list')) renderList(results());
  }
  const pubOpt = (key) => (pub && pub.races && pub.races[key]) || {};
  const pubAddress = () => pub && pub.username ? 'sendoff.run/@' + pub.username : '';
  function renderPub() {
    const host = $('pubprof');
    if (!pub || PUBLIC) { host.hidden = true; return; }
    host.hidden = false;
    const noName = !pub.username;
    host.innerHTML = `<h2 class="p-h2">Public profile</h2><div class="p-card">
      <label class="p-check"><input type="checkbox" id="pub-on"${pub.public ? ' checked' : ''}${noName ? ' disabled' : ''}>
        Make my profile public</label>
      ${noName ? `<p class="p-uname-help">Pick a username first: it is the address of your public profile.</p>` : ''}
      ${pub.public ? `
        <div class="p-pub-addr"><a href="/@${esc(pub.username)}" target="_blank" rel="noopener" id="pub-link">${esc(pubAddress())}</a>
          <button type="button" class="p-textbtn" id="pub-copy">Copy</button>
          <a class="p-textbtn" href="/@${esc(pub.username)}" target="_blank" rel="noopener">See it as others do</a></div>
        <label class="p-check"><input type="checkbox" id="pub-index"${pub.indexable ? ' checked' : ''}>
          Let search engines show my profile</label>` : ''}
      <p class="p-uname-help">${pub.public
        ? 'Anyone with the address can see your name, your listed public races and races you entered by hand, with times, places and results links. Private and unlisted races never appear, not even in the totals, so the totals there can be smaller than here. Reports and fueling numbers show only on races where you switch them on below.'
        : 'Off. Nobody can see this page but you. Switch it on to share your races and results at an address made from your username.'}</p>
    </div>`;
  }
  // The switches on each race card, when the profile is public.
  function pubControls(r) {
    if (PUBLIC || !pub || !pub.public) return '';
    const key = r.manual ? r.id : r.slug;
    if (!r.manual && r.visibility !== 'public') {
      return `<div class="p-race-pub"><span class="lbl">Public profile</span> Private or unlisted race: never shown there.</div>`;
    }
    const o = pubOpt(key);
    const chip = (f, on, label) => `<button type="button" class="p-pubchip" data-pub="${f}" data-key="${esc(key)}" aria-pressed="${on}">${label}</button>`;
    return `<div class="p-race-pub"><span class="lbl">Public profile</span>
      ${chip('hide', !o.hide, o.hide ? 'Hidden' : 'Shown')}
      ${o.hide ? '' : chip('report', !!o.report, 'Report')}
      ${o.hide || r.manual ? '' : chip('fuel', !!o.fuel, 'Fueling')}</div>`;
  }
  async function savePub(body) {
    try { pub = await Race.api.savePublicSettings(body); }
    catch (err) { showError('Could not save that: ' + (err.message || err)); }
    renderPub(); renderList(results());
  }
  document.addEventListener('change', (e) => {
    if (e.target.id === 'pub-on') savePub({ public: e.target.checked });
    else if (e.target.id === 'pub-index') savePub({ indexable: e.target.checked });
  });
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'pub-copy') {
      try { await navigator.clipboard.writeText('https://' + pubAddress()); e.target.textContent = 'Copied'; }
      catch (err) { e.target.textContent = 'Copy failed'; }
      setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
      return;
    }
    const b = e.target.closest && e.target.closest('[data-pub]');
    if (!b) return;
    const f = b.dataset.pub, key = b.dataset.key, o = pubOpt(key);
    // The chip says what is true now; pressing it flips that.
    savePub({ race: { key, [f]: f === 'hide' ? !o.hide : !o[f] } });
  });

  // ---------- username ----------
  // A handle that names you without being a way to sign in. Offered once
  // with a suggestion from your name; "Not now" folds it to one line.
  const UNAME_LATER = 'so:uname-later';
  let uname = null, unameEditing = false, unameTimer = null;
  const suggestName = () => {
    const n = (($('who').textContent || '').trim().toLowerCase() === 'your races' ? '' : $('who').textContent || '')
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim()
      .replace(/\s+/g, '_').replace(/[^a-z0-9_.]/g, '').replace(/^[._]+|[._]+$/g, '').slice(0, 20);
    return n.length >= 3 ? n : '';
  };
  function renderUname() {
    const host = $('uname');
    if (!uname) { host.hidden = true; return; }
    host.hidden = false;
    let later = false;
    try { later = !!localStorage.getItem(UNAME_LATER); } catch (e) {}
    const help = `<p class="p-uname-help">Not used to sign in. People can find you by it and add you to a race
      without knowing your email address. 3 to 20 letters, numbers, underscores or full stops.</p>`;
    if (!uname.username && later && !unameEditing) {
      host.innerHTML = `<p class="p-hidden-line">No username yet. <button type="button" class="p-textbtn" id="uname-pick">Pick one</button></p>`;
      return;
    }
    if (uname.username && !unameEditing) {
      const wait = uname.nextChangeAt ? new Date(uname.nextChangeAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
      host.innerHTML = `<h2 class="p-h2">Username</h2><div class="p-card">
        <div class="p-uname-row"><span class="p-handle">@${esc(uname.username)}</span>
          ${wait ? `<span class="p-uname-help">You can change it again on ${esc(wait)}.</span>`
                 : `<button type="button" class="btn" id="uname-change">Change</button>`}</div>
        <label class="p-check"><input type="checkbox" id="uname-findable"${uname.findable ? ' checked' : ''}>
          Let people find me by username</label>
        <p class="p-uname-help">${uname.findable
          ? 'Signed-in people can find you by it and add you to a race. They see your username and your name, never your email.'
          : 'Nobody can find you by it or add you by it. Your username stays yours.'}</p>
      </div>`;
      return;
    }
    const start = uname.username || suggestName();
    host.innerHTML = `<h2 class="p-h2">${uname.username ? 'Change your username' : 'Pick a username'}</h2><div class="p-card">
      <form id="uname-form" class="p-uname-row" novalidate>
        <label class="p-uname-field"><span aria-hidden="true">@</span>
          <input type="text" id="uname-input" value="${esc(start)}" maxlength="20" autocomplete="off" spellcheck="false"
                 autocapitalize="off" aria-label="Username" aria-describedby="uname-msg"></label>
        <button type="submit" class="btn primary" id="uname-save">Save</button>
        <button type="button" class="p-textbtn" id="uname-cancel">${uname.username ? 'Cancel' : 'Not now'}</button>
      </form>
      <p class="p-uname-msg" id="uname-msg" role="status"></p>
      ${uname.username ? '<p class="p-uname-help">After a change you can change it again in 30 days, and nobody else can take your old one for 30 days.</p>' : ''}
      ${help}
    </div>`;
    if (start) checkUname();
  }
  function checkUname() {
    clearTimeout(unameTimer);
    const input = $('uname-input'), msg = $('uname-msg');
    if (!input) return;
    const v = input.value.trim().replace(/^@/, '');
    if (!v) { msg.textContent = ''; msg.className = 'p-uname-msg'; return; }
    if (uname.username && v.toLowerCase() === uname.username.toLowerCase()) { msg.textContent = 'That is your username now.'; msg.className = 'p-uname-msg'; return; }
    unameTimer = setTimeout(async () => {
      let r;
      try { r = await Race.api.usernameCheck(v); } catch (e) { return; }
      if (!$('uname-input') || $('uname-input').value.trim().replace(/^@/, '') !== v) return;
      msg.textContent = r.ok ? '@' + v + ' is free.' : r.reason;
      msg.className = 'p-uname-msg ' + (r.ok ? 'ok' : 'err');
    }, 300);
  }
  async function loadUname() {
    try { uname = await Race.api.username(); } catch (e) { uname = null; }
    renderUname();
  }
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'uname-input') return;
    // The @ is drawn beside the box, so one typed or pasted in is dropped.
    if (e.target.value.startsWith('@')) e.target.value = e.target.value.replace(/^@+/, '');
    checkUname();
  });
  document.addEventListener('change', async (e) => {
    if (e.target.id !== 'uname-findable') return;
    e.target.disabled = true;
    try { uname = await Race.api.setFindable(e.target.checked); renderUname(); }
    catch (err) { e.target.disabled = false; e.target.checked = !e.target.checked; showError('Could not save that: ' + (err.message || err)); }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'uname-form') return;
    e.preventDefault();
    const v = $('uname-input').value.trim().replace(/^@/, '');
    const msg = $('uname-msg');
    if (!v) { msg.textContent = 'Type a username first.'; msg.className = 'p-uname-msg err'; return; }
    $('uname-save').disabled = true;
    try {
      uname = await Race.api.setUsername(v);
      unameEditing = false;
      renderUname();
      // The public address is made from it.
      loadPub();
    } catch (err) {
      $('uname-save').disabled = false;
      msg.textContent = err.message || String(err); msg.className = 'p-uname-msg err';
      $('uname-input').focus();
    }
  });
  document.addEventListener('click', (e) => {
    const id = e.target.id;
    if (id === 'uname-pick' || id === 'uname-change') {
      unameEditing = true; renderUname();
      const i = $('uname-input'); if (i) { i.focus(); i.select(); }
    } else if (id === 'uname-cancel') {
      if (!uname.username) { try { localStorage.setItem(UNAME_LATER, '1'); } catch (err) {} }
      unameEditing = false; renderUname();
    }
  });

  function showError(msg) { const b = $('error'); b.textContent = msg; b.style.display = ''; }

  // A public profile: no sign-in, and only what the worker's public answer
  // holds, which is only what the racer chose to show.
  async function loadPublic() {
    try { await Race.hub.load(); } catch (e) {}
    $('foot').innerHTML = `<span>A racer profile on <a href="/">SendOff</a></span><span><a href="/app/">Races on SendOff</a></span>`;
    const base = (Race.hub.proxyUrl && Race.hub.proxyUrl() || '').replace(/\/+$/, '');
    let res = null, data = null;
    try {
      res = await fetch(base + '/public-profile?u=' + encodeURIComponent(PUBLIC_NAME));
      data = res.ok ? await res.json() : null;
    } catch (e) { data = null; }
    if (!data) {
      document.title = 'Not found · SendOff';
      $('who').innerHTML = 'Not <em>found</em>';
      $('body').innerHTML = `<p class="p-empty">There is no public profile at this address. Either nobody has this
        username, or its owner has not made their profile public.</p>`;
      return;
    }
    document.title = `${data.name} · SendOff`;
    $('who').textContent = data.name;
    const crumb = [...document.querySelectorAll('.brand-meta span')].find(x => x.textContent.trim() === 'Profile');
    if (crumb) crumb.textContent = '@' + data.username;
    const canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.href = 'https://sendoff.run/@' + data.username;
    if (data.indexable) { const m = $('robots-meta'); if (m) m.remove(); }
    state = {
      email: PUBLIC_ME,
      races: (data.races || []).map(r => ({ slug: r.slug, visibility: 'public', runner: r.runner,
        config: { ...r.config, runners: (r.config.runners || []).map(x => ({ ...x, email: PUBLIC_ME })) } })),
      results: { bySlug: Object.fromEntries((data.races || []).filter(r => r.entered).map(r => [r.slug, r.entered])),
                 manual: data.manual || [], notMine: [] },
      candidates: [], hidden: []
    };
    render();
  }

  async function load() {
    if (PUBLIC) return loadPublic();
    // hub.json first: it says whether this deployment signs in through the
    // worker, and without it every session reads as signed out.
    try { await Race.hub.load(); } catch (e) { /* the check below says what it can */ }
    const sess = Race.auth.cfg();
    if (!sess || sess.mode !== 'proxy') {
      $('body').innerHTML = `<p class="p-empty">Sign in to see your races and results.</p>
        <p><button type="button" class="btn primary" id="signin">Sign in</button></p>`;
      $('signin').addEventListener('click', () => Race.openSigninModal && Race.openSigninModal());
      return;
    }
    try {
      state = await Race.api.myResults();
      state.results = state.results || { bySlug: {}, manual: [] };
      try {
        const { profile } = await Race.api.profile();
        const name = profile && (profile.displayName || [profile.firstName, profile.lastName].filter(Boolean).join(' '));
        if (name) $('who').innerHTML = esc(name);
      } catch (e) { /* the page works without a name */ }
      render();
      loadUname();
      loadPub();
    } catch (e) {
      showError('Could not load your races: ' + (e.message || e));
      $('body').innerHTML = '';
    }
  }
  load();
</script>
</body>
</html>
